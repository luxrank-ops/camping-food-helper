  /* ---------- 장박 주간 식단 플래너 & 식재료·장비 취합 ---------- */
  var PLAN_PERIODS=[
    {nights:1,days:2,label:'1박 2일',tag:'주말 1박 (5끼)'},
    {nights:2,days:3,label:'2박 3일',tag:'대표 장박 (8끼)',popular:true},
    {nights:3,days:4,label:'3박 4일',tag:'힐링 장박 (11끼)'},
    {nights:4,days:5,label:'4박 5일',tag:'장기 캠핑 (14끼)'},
    {nights:6,days:7,label:'일주일 (7일)',tag:'주간 완전정복 (20끼)'}
  ];

  var PLAN_THEMES=[
    {id:'all',label:'셰프 균형식 🌟',desc:'고기·국물·면·브런치가 골고루 어우러진 베스트 조합'},
    {id:'meat',label:'고기·바비큐파 🥩',desc:'삼겹살·돈마호크·스테이크·차돌박이 중심'},
    {id:'easy',label:'초간단·원팬 ⚡',desc:'15분 이내 조리, 설거지와 쓰레기 최소화'},
    {id:'soup',label:'얼큰국물·안주 🍲',desc:'부대찌개·전골·어묵탕·감바스 등 시원한 국물과 안주'},
    {id:'family',label:'가족·아이동반 👨‍👩‍👧',desc:'맵지 않고 달콤고소한 온 가족 맞춤형 식단'}
  ];

  function getPlanPeriod(days){
    for(var i=0;i<PLAN_PERIODS.length;i++){
      if(PLAN_PERIODS[i].days===days)return PLAN_PERIODS[i];
    }
    return PLAN_PERIODS[1];
  }

  function getEligibleRecipesForMeal(mealName,theme,avoidArr,userGear){
    return CAMP_RECIPES.filter(function(r){
      if(r.meals.indexOf(mealName)<0)return false;
      var fullText=r.name+' '+(r.base||[]).map(function(b){return b.n}).join(' ');
      for(var i=0;i<avoidArr.length;i++){
        if(avoidArr[i]&&fullText.indexOf(avoidArr[i])>=0)return false;
      }
      return true;
    }).sort(function(a,b){
      var scoreA=0,scoreB=0;
      if(theme==='meat'){
        if(/삼겹|돈마호크|스테이크|차돌|우대갈비|소시지|닭/.test(a.name))scoreA+=20;
        if(/삼겹|돈마호크|스테이크|차돌|우대갈비|소시지|닭/.test(b.name))scoreB+=20;
      }else if(theme==='easy'){
        if(a.minutes<=15)scoreA+=20;
        if(b.minutes<=15)scoreB+=20;
      }else if(theme==='soup'){
        if(a.moods.indexOf('국물 요리')>=0)scoreA+=20;
        if(b.moods.indexOf('국물 요리')>=0)scoreB+=20;
      }else if(theme==='family'){
        if(/스모어|콘치즈|떡볶이|누룽지|토스트|소시지|닭한마리|어묵탕/.test(a.name))scoreA+=20;
        if(/스모어|콘치즈|떡볶이|누룽지|토스트|소시지|닭한마리|어묵탕/.test(b.name))scoreB+=20;
      }
      return scoreB-scoreA;
    });
  }

  function buildMultiDayPlan(days,people,theme,snackEnabled,avoidArr,userGear){
    var period=getPlanPeriod(days);
    var usedNames={};
    var dayPlans=[];

    for(var d=1;d<=days;d++){
      var dayMeals=[];
      var isFirstDay=(d===1);
      var isLastDay=(d===days);

      var slots=[];
      if(isFirstDay){
        slots.push({key:'lunch',label:'점심 ☀️',mealName:'점심',note:'도착 후 빠른 세팅 점심'});
        slots.push({key:'dinner',label:'저녁 🌙',mealName:'저녁',note:'캠핑 첫날 메인 바비큐 & 구이'});
        if(snackEnabled)slots.push({key:'snack',label:'불멍 야식 🔥',mealName:'불멍 안주',note:'첫날 밤 타오르는 불멍 간식'});
      }else if(isLastDay){
        slots.push({key:'breakfast',label:'아침 🌅',mealName:'아침',note:'철수 날 10분 속 편한 간편식 (설거지 최소화)'});
        slots.push({key:'lunch',label:'점심 ☀️',mealName:'점심',note:'텐트 정리 후 가벼운 마무리 식사'});
      }else{
        slots.push({key:'breakfast',label:'아침 🌅',mealName:'아침',note:'상쾌한 숲속 힐링 아침'});
        slots.push({key:'lunch',label:'점심 ☀️',mealName:'점심',note:'오후 활동 전 든든한 점심'});
        slots.push({key:'dinner',label:'저녁 🌙',mealName:'저녁',note:'따끈한 전골 & 찌개 파티'});
        if(snackEnabled)slots.push({key:'snack',label:'불멍 야식 🔥',mealName:'불멍 안주',note:'낭만적인 밤 감성 안주'});
      }

      slots.forEach(function(slot){
        var pool=getEligibleRecipesForMeal(slot.mealName,theme,avoidArr,userGear);
        var chosen=null;
        for(var i=0;i<pool.length;i++){
          if(!usedNames[pool[i].name]){chosen=pool[i];break}
        }
        if(!chosen&&pool.length){
          chosen=pool[Math.floor(Math.random()*pool.length)];
        }
        if(chosen){
          usedNames[chosen.name]=true;
          dayMeals.push({
            slotKey:slot.key,
            mealLabel:slot.label,
            mealNote:slot.note,
            dish:chosen.name,
            minutes:chosen.minutes,
            level:chosen.level,
            equipment:chosen.equipment||[],
            base:chosen.base||[],
            pairing:chosen.pairing||'',
            reason:chosen.reason||''
          });
        }
      });

      var dayThemeTitle='';
      var dayHint='';
      if(isFirstDay){
        dayThemeTitle='신선육 바비큐 & 감성 나잇';
        dayHint='🧊 쿨러 냉기가 가장 강한 첫날! 신선한 생고기와 생채소를 우선 소비하세요.';
      }else if(isLastDay){
        dayThemeTitle='철수 날 원팬 간편식 & 클린업';
        dayHint='⛺ 짐정리와 철수가 있으므로 코펠/원팬으로 10분 내 해결하고 설거지를 최소화하세요.';
      }else{
        dayThemeTitle=(d===2?'든든한 전골 & 힐링 캠프식':'다채로운 캠핑 별미의 날');
        dayHint='🥫 진공 소분된 육류, 냉동 밀키트, 따끈한 전골과 면 요리로 여유롭게 즐기세요.';
      }

      dayPlans.push({
        dayNum:d,
        themeTitle:dayThemeTitle,
        hint:dayHint,
        meals:dayMeals
      });
    }

    return {
      days:dayPlans,
      people:people,
      periodDays:days,
      label:period.label,
      tag:period.tag,
      theme:theme,
      snack:snackEnabled,
      createdAt:Date.now()
    };
  }

  function getIngredientTag(name){
    if(/생|고기|삼겹|돈마호크|스테이크|차돌|닭|바지락|새우|순두부|대파|양파|마늘|청양고추|감자|버섯|숙주|부추|깻잎|알배기배추|토마토/.test(name)){
      return 'prep';
    }
    if(/생수|얼음|장작|숯|맥주|소주|와인|하이볼|쌈채소|부탄가스|이소가스/.test(name)){
      return 'buy';
    }
    return 'pack';
  }

  function aggregatePlan(plan){
    if(!plan||!plan.days)return {ingredients:[],equipment:[],supplies:[],totalMeals:0,totalDays:0};
    var ingMap={};
    var eqMap={};
    var totalMeals=0;
    var userGear=profile.gear||[];

    plan.days.forEach(function(day){
      day.meals.forEach(function(m){
        totalMeals++;
        var dayMealTag=day.dayNum+'일차 '+m.mealLabel.replace(/[^가-힣]/g,'');

        (m.base||[]).forEach(function(b){
          var scaledQ=Math.round(b.q*plan.people*10)/10;
          var key=b.n;
          if(!ingMap[key]){
            ingMap[key]={
              name:key,
              amount:scaledQ+b.u,
              qNum:scaledQ,
              unit:b.u,
              tag:getIngredientTag(key),
              meals:[dayMealTag]
            };
          }else{
            ingMap[key].amount=sumAmounts(ingMap[key].amount,scaledQ+b.u);
            if(ingMap[key].meals.indexOf(dayMealTag)<0){
              ingMap[key].meals.push(dayMealTag);
            }
          }
        });

        (m.equipment||[]).forEach(function(eq){
          if(!eqMap[eq]){
            eqMap[eq]={
              name:eq,
              owned:userGear.indexOf(eq)>=0,
              count:1
            };
          }else{
            eqMap[eq].count++;
          }
        });
      });
    });

    var ingredients=Object.keys(ingMap).map(function(k){return ingMap[k]});
    ingredients.sort(function(a,b){
      var order={prep:0,pack:1,buy:2};
      return (order[a.tag]||0)-(order[b.tag]||0);
    });

    var equipment=Object.keys(eqMap).map(function(k){return eqMap[k]});
    equipment.sort(function(a,b){
      if(a.owned!==b.owned)return a.owned?1:-1;
      return b.count-a.count;
    });

    var supplies=[
      {name:'부탄가스 / 이소가스',amount:Math.max(2,Math.ceil(totalMeals/2.5))+'캔',tag:'buy'},
      {name:'종이호일 & 지퍼백',amount:'각 1롤/1세트 (소분 및 팬 요리 설거지 방지)',tag:'pack'},
      {name:'키친타월 & 물티슈',amount:Math.ceil((plan.periodDays||3)/2)+'팩',tag:'pack'},
      {name:'캠핑용 식기·수저 세트',amount:(plan.people||2)+'인 세트',tag:'pack'},
      {name:'보냉 아이스팩 & 각얼음',amount:'쿨러 보냉용 2~3팩',tag:'buy'},
      {name:'쓰레기봉투 & 분리수거백',amount:(plan.periodDays||3)+'장',tag:'pack'},
      {name:'양념 소분 키트 (소금·오일·쌈장)',amount:'작은 공병 소분',tag:'prep'}
    ];

    return {
      ingredients:ingredients,
      equipment:equipment,
      supplies:supplies,
      totalMeals:totalMeals,
      totalDays:plan.days.length
    };
  }

  function swapMealQuick(dayIdx,mealIdx){
    if(!ui.mealPlan||!ui.mealPlan.days[dayIdx])return;
    var day=ui.mealPlan.days[dayIdx];
    var m=day.meals[mealIdx];
    if(!m)return;

    var curMealName='저녁';
    if(m.slotKey==='breakfast')curMealName='아침';
    else if(m.slotKey==='lunch')curMealName='점심';
    else if(m.slotKey==='snack')curMealName='불멍 안주';

    var pool=getEligibleRecipesForMeal(curMealName,ui.planTheme,profile.avoid,profile.gear);
    var candidates=pool.filter(function(r){
      return r.name!==m.dish;
    });
    if(!candidates.length)candidates=pool;
    if(candidates.length){
      var nextRecipe=candidates[Math.floor(Math.random()*candidates.length)];
      m.dish=nextRecipe.name;
      m.minutes=nextRecipe.minutes;
      m.level=nextRecipe.level;
      m.equipment=nextRecipe.equipment||[];
      m.base=nextRecipe.base||[];
      m.pairing=nextRecipe.pairing||'';
      m.reason=nextRecipe.reason||'';
      store.set('cc.mealPlan',ui.mealPlan);
      showNotice('🔄 「'+m.dish+'」으로 식단을 변경하고 식재료·장비를 다시 합산했어요!');
      render();
    }
  }

  function selectSwapDish(dishName){
    if(!ui.planSwapTarget||!ui.mealPlan)return;
    var dayIdx=ui.planSwapTarget.dayIdx;
    var mealIdx=ui.planSwapTarget.mealIdx;
    var day=ui.mealPlan.days[dayIdx];
    if(!day)return;
    var m=day.meals[mealIdx];
    if(!m)return;

    var foundRecipe=CAMP_RECIPES.find(function(r){return r.name===dishName});
    if(foundRecipe){
      m.dish=foundRecipe.name;
      m.minutes=foundRecipe.minutes;
      m.level=foundRecipe.level;
      m.equipment=foundRecipe.equipment||[];
      m.base=foundRecipe.base||[];
      m.pairing=foundRecipe.pairing||'';

    }else{

  function fallbackCopyText(text){
    var ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.left='-9999px';
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand('copy');
      showNotice('📋 식단표 & 장보기 목록을 복사했어요! 카카오톡에 붙여넣어 공유하세요.');
    }catch(e){
      showNotice('복사에 실패했어요. 화면의 내용을 직접 복사해 주세요.');
    }
    document.body.removeChild(ta);
  }

  function copyPlanText(plan,agg){
    var lines=[];
    lines.push('🏕️ ['+plan.label+' 캠핑 주간 식단표 & 장보기 목록 ('+plan.people+'명)]');
    lines.push('━━━━━━━━━━━━━━━━━━━━');
    plan.days.forEach(function(day){
      lines.push('\n📅 '+day.dayNum+'일차 ('+day.themeTitle+')');
      day.meals.forEach(function(m){
        lines.push(' · '+m.mealLabel+': '+m.dish+' ('+m.minutes+'분, '+(m.equipment||[]).join('/')+')');
      });
    });
    lines.push('\n━━━━━━━━━━━━━━━━━━━━');
    lines.push('🛒 [전체 식재료 장보기 합산 목록 ('+agg.ingredients.length+'종)]');
    agg.ingredients.forEach(function(ing){
      var tagStr=ing.tag==='prep'?'[집에서 손질]':(ing.tag==='buy'?'[현장 구매]':'[챙겨갈 것]');
      lines.push(' · '+ing.name+' '+ing.amount+' '+tagStr);
    });
    lines.push('\n🍳 [필요 조리 장비 & 소모품]');
    var eqList=agg.equipment.map(function(e){return e.name+(e.owned?'(보유)':'(챙기기)')}).join(', ');
    lines.push(' · 장비: '+eqList);
    var supList=agg.supplies.map(function(s){return s.name+' '+s.amount}).join(', ');
    lines.push(' · 소모품: '+supList);
    lines.push('\n- 캠핑음식 도우미 주간 식단 플래너에서 생성됨');

    var fullText=lines.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(fullText).then(function(){
        showNotice('📋 식단표 & 장보기 목록을 복사했어요! 카카오톡에 붙여넣어 공유하세요.');
      }).catch(function(){
        fallbackCopyText(fullText);
      });
    }else{
      fallbackCopyText(fullText);
    }
  }

  function loadSecretGardens(force){
    if(ui.gardenLoaded && !force) return;
    ui.gardenBusy = true;
    if(!ui.gardenMasterKey){
      ui.gardenMasterKey = store.get('cc.gardenMasterKey', '') || '';
    }
    var masterParam = ui.gardenMasterKey ? ('?master_key=' + encodeURIComponent(ui.gardenMasterKey)) : '';
    fetch('/api/secret-gardens' + masterParam)
      .then(function(r){
        if(!r.ok) throw new Error('API not available');
        return r.json();
      })
      .then(function(data){
        ui.gardenBusy = false;
        ui.gardenLoaded = true;
        ui.gardenIsMaster = !!(data.authorized || data.isMaster);
        ui.gardenList = data.gardens || [];
        render();
      })
      .catch(function(){
        fetch('data/secret_gardens.json')
          .then(function(r){ return r.ok ? r.json() : []; })
          .then(function(list){
            ui.gardenBusy = false;
            ui.gardenLoaded = true;
            var localList = store.get('cc.localGardens', []) || [];
            ui.gardenList = localList.concat(Array.isArray(list) ? list : []);
            render();
          })
          .catch(function(e){
            ui.gardenBusy = false;
            ui.gardenLoaded = true;
            ui.gardenList = store.get('cc.localGardens', []) || [];
            console.error('Failed to load gardens:', e);
            render();
          });
      });
  }

  function getFilteredGardens(){
    var pool = (ui.gardenList || []).slice();
    if(ui.gardenFilter && ui.gardenFilter !== 'all'){
      if(ui.gardenFilter === 'private'){
        pool = pool.filter(function(g){ return g.isPrivate; });
      } else {
        pool = pool.filter(function(g){ return g.category === ui.gardenFilter; });
      }
    }
    if(ui.gardenFacFilter){
      pool = pool.filter(function(g){
        if(!g.facilities || !Array.isArray(g.facilities)) return false;
        return g.facilities.some(function(f){ return f.indexOf(ui.gardenFacFilter) >= 0; });
      });
    }
    if(ui.gardenSearch){
      var q = ui.gardenSearch.toLowerCase().trim();
      pool = pool.filter(function(g){
        var name = (g.name || '').toLowerCase();
        var addr = (g.address || g.addressMasked || '').toLowerCase();
        var detail = (g.addressDetail || '').toLowerCase();
        var tips = (g.tips || '').toLowerCase();
        var facs = (g.facilities || []).join(' ').toLowerCase();
        var author = (g.author || '').toLowerCase();
        return name.indexOf(q)>=0 || addr.indexOf(q)>=0 || detail.indexOf(q)>=0 || tips.indexOf(q)>=0 || facs.indexOf(q)>=0 || author.indexOf(q)>=0;
      });
    }
    // 정렬 (최신순 / 찜순 / 이름순 / 조회순)
    var sort = ui.gardenSort || 'newest';
    if(sort === 'likes'){
      pool.sort(function(a,b){ return (b.likes||0) - (a.likes||0); });
    } else if(sort === 'name'){
      pool.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    } else if(sort === 'views'){
      pool.sort(function(a,b){ return (b.views||0) - (a.views||0); });
    } else {
      pool.sort(function(a,b){ return new Date(b.createdAt||0) - new Date(a.createdAt||0); });
    }
    return pool;
  }

  function isSpotUnlocked(spot){
    if(!spot.isPrivate) return true;
    if(ui.gardenIsMaster) return true;
    if(ui.gardenUnlockedIds && ui.gardenUnlockedIds.indexOf(spot.id) >= 0) return true;
    return false;
  }

  var REGION_COORDS = {
    '홍천': [37.6972, 127.8887], '영월': [37.1838, 128.4619], '충주': [36.9912, 127.9261],
    '가평': [37.8315, 127.5095], '포천': [37.8949, 127.2003], '양평': [37.4917, 127.4875],
    '춘천': [37.8813, 127.7298], '원주': [37.3422, 127.9202], '강릉': [37.7519, 128.8761],
    '태안': [36.7456, 126.2977], '평창': [37.3708, 128.3902], '인제': [38.0697, 128.1706],
    '단양': [36.9845, 128.3653], '제천': [37.1326, 128.1910], '정선': [37.3806, 128.6608],
    '괴산': [36.8153, 127.7867], '서산': [36.7845, 126.4503], '보령': [36.3333, 126.6128],
    '남해': [34.8377, 127.8924], '거제': [34.8806, 128.6211], '경주': [35.8562, 129.2247],
    '울진': [36.9931, 129.4003], '삼척': [37.4499, 129.1652], '동해': [37.5247, 129.1143],
    '속초': [38.2070, 128.5918], '고성': [38.3806, 128.4678], '양양': [38.0754, 128.6189],
    '여수': [34.7604, 127.6622], '순천': [34.9506, 127.4872], '담양': [35.3211, 126.9882],
    '완주': [35.9048, 127.1624], '무주': [36.0068, 127.6608], '진안': [35.7915, 127.4248],
    '연천': [38.0964, 127.0748], '파주': [37.7600, 126.7799], '강화': [37.7466, 126.4880],
    '제주': [33.4996, 126.5312], '서귀포': [33.2541, 126.5601]
  };

  function getSpotCoords(spot){
    if(spot.lat && spot.lng && !isNaN(spot.lat) && !isNaN(spot.lng)){
      return [Number(spot.lat), Number(spot.lng)];
    }
    var fullStr = (spot.address || '') + ' ' + (spot.name || '');
    for(var reg in REGION_COORDS){
      if(fullStr.indexOf(reg) >= 0){
        var base = REGION_COORDS[reg];
        var seed = (spot.id ? spot.id.charCodeAt(spot.id.length-1) : 1) % 10;
        return [base[0] + (seed - 5) * 0.007, base[1] + (seed - 5) * 0.007];
      }
    }
    var s1 = (spot.id ? spot.id.charCodeAt(3)||1 : 1)%10;
    var s2 = (spot.id ? spot.id.charCodeAt(4)||1 : 1)%10;
    return [37.3 + (s1 - 5) * 0.06, 127.8 + (s2 - 5) * 0.06];
  }

  function handleGardenPhotoUpload(file, isEdit){
    if(!file) return;
    if(!file.type || !file.type.startsWith('image/')){
      showNotice('이미지 파일만 선택할 수 있습니다.');
      return;
    }
    showNotice('📷 사진을 압축 및 최적화하는 중입니다…');
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        try {
          var maxDim = 1200;
          var w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            if(w > h){
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);

          // 즉시 UI 프리뷰 반영
          if(isEdit){
            ui.gardenEditUploadedPhoto = compressedBase64;
          } else {
            ui.gardenUploadedPhoto = compressedBase64;
          }
          render();

          // 서버 저장소(/api/upload-image)로 전송하여 파일 URL 획득
          fetch('/api/upload-image', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ imageBase64: compressedBase64 })
          })
          .then(function(r){ return r.json(); })
          .then(function(d){
            if(d.success && d.url){
              if(isEdit){
                ui.gardenEditUploadedPhoto = d.url;
              } else {
                ui.gardenUploadedPhoto = d.url;
              }
              showNotice('📸 사진이 성공적으로 업로드되었습니다!');
            }
          })
          .catch(function(){
            showNotice('📸 사진이 정상적으로 선택되었습니다.');
          });
        } catch(err){
          console.error('Image compression error:', err);
          if(isEdit){
            ui.gardenEditUploadedPhoto = ev.target.result;
          } else {
            ui.gardenUploadedPhoto = ev.target.result;
          }
          render();
          showNotice('📸 사진이 선택되었습니다.');
        }
      };
      img.onerror = function(){
        showNotice('이미지 파일을 읽을 수 없습니다.');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function initOrUpdateGardenMap(){
    if(ui.tab !== 'garden'){
      if(gardenMapInstance){
        try{ gardenMapInstance.remove(); }catch(e){}
        gardenMapInstance = null;
        gardenMapMarkers = [];
      }
      return;
    }
    var mapEl = document.getElementById('garden-interactive-map');
    if(!mapEl || !window.L) return;

    var needsNew = !gardenMapInstance || !mapEl._leaflet_id;
    if(needsNew){
      if(gardenMapInstance){
        try { gardenMapInstance.remove(); } catch(e){}
        gardenMapInstance = null;
      }
      try {
        gardenMapInstance = L.map(mapEl, {
          scrollWheelZoom: false,
          zoomControl: true
        }).setView([36.8, 127.8], 7);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18,
          attribution: '&copy; OpenStreetMap'
        }).addTo(gardenMapInstance);
      } catch(err){
        console.error('Map init error:', err);
        return;
      }
    }

    if(gardenMapMarkers && gardenMapMarkers.length){
      try {
        gardenMapMarkers.forEach(function(m){ m.remove(); });
      } catch(e){}
    }
    gardenMapMarkers = [];

    var spots = ui.gardenList || [];
    if(!spots.length){
      setTimeout(function(){
        if(gardenMapInstance) gardenMapInstance.invalidateSize();
      }, 100);
      return;
    }

    var markerObjects = [];

    spots.forEach(function(spot){
      var coords = getSpotCoords(spot);
      if(!coords || isNaN(coords[0]) || isNaN(coords[1])) return;

      var unlocked = isSpotUnlocked(spot);
      var catInfo = GARDEN_CATEGORIES[spot.category] || { label:'노지', icon:'🏞️' };
      var isPriv = !!spot.isPrivate;

      var iconHtml = '<div class="garden-marker-pin '+(isPriv?'private':'')+'">'+
        catInfo.icon + (isPriv ? '<span class="mini-lock">🔒</span>' : '') +
      '</div>';

      var customIcon = L.divIcon({
        className: 'garden-leaflet-marker',
        html: iconHtml,
        iconSize: [34, 34],
        iconAnchor: [17, 34],
        popupAnchor: [0, -34]
      });

      var marker = L.marker(coords, { icon: customIcon });

      var photoUrl = spot.photoUrl || (typeof GARDEN_PHOTO_PRESETS !== 'undefined' ? GARDEN_PHOTO_PRESETS[0].url : '');
      var thumbHtml = 
        '<div class="garden-map-popup-hero">'+
          '<img class="garden-map-popup-img" src="'+esc(photoUrl)+'" alt="'+esc(spot.name)+'" loading="lazy" onerror="this.src=\'https://images.unsplash.com/photo-1510312305653-8ed496efae75?auto=format&fit=crop&w=800&q=80\'">'+
          '<div class="garden-map-popup-grad"></div>'+
          '<div class="garden-map-popup-badges">'+
            '<span class="garden-map-popup-badge cat">'+catInfo.icon+' '+catInfo.label+'</span>'+
            (isPriv ? 
              '<span class="garden-map-popup-badge priv">🔒 비밀</span>' : 
              '<span class="garden-map-popup-badge pub">🌐 공개</span>')+
          '</div>'+
          '<span class="garden-map-popup-badge fee">💰 '+(spot.fee==='무료'?'무료':esc(spot.fee||'무료'))+'</span>'+
        '</div>';

      var facChips = '';
      if(spot.facilities && spot.facilities.length){
        facChips = '<div class="garden-map-popup-tags">'+
          spot.facilities.slice(0, 3).map(function(f){
            return '<span class="garden-map-popup-tag">✓ '+esc(f)+'</span>';
          }).join('') +
          (spot.facilities.length > 3 ? '<span class="garden-map-popup-tag" style="background:none;color:#5c6f66">+'+(spot.facilities.length - 3)+'</span>' : '') +
        '</div>';
      }

      var metaLine = (spot.groundType ? '🌾 ' + esc(spot.groundType) : '') + 
        (spot.toiletStatus ? ' · 🚻 ' + esc(spot.toiletStatus) : '');
      var isFav = (ui.favCamps || []).indexOf(spot.name) >= 0;

      var popupHtml = '<div style="width:100%">'+
        thumbHtml +
        '<div class="garden-map-popup-body">'+
          '<h4 class="garden-map-popup-title">'+esc(spot.name)+'</h4>'+
          '<div class="garden-map-popup-meta">'+
            (unlocked ? '📍 <b>' + esc(spot.address || '상세 주소 없음') + '</b>' : '📍 ' + esc(spot.addressMasked || '비공개 스팟 (잠금)'))+
          '</div>'+
          (metaLine ? '<div style="font-size:11px;color:#5a7367;font-weight:700;margin-bottom:6px">'+metaLine+'</div>' : '')+
          facChips +
          '<div class="garden-map-popup-actions">'+
            '<button class="garden-map-popup-btn" type="button" data-a="garden-detail-open" data-id="'+esc(spot.id)+'">'+
              '🔍 상세 보기'+
            '</button>'+
            '<button class="garden-map-popup-btn fav '+(isFav?'active':'')+'" type="button" data-a="camp-fav" data-name="'+esc(spot.name)+'" data-spot-id="'+esc(spot.id)+'" title="'+(isFav?'즐겨찾기 찜 해제':'캠핑장 즐겨찾기 찜하기')+'">'+
              (isFav ? '❤️ 찜됨' : '🤍 찜하기')+
            '</button>'+
            (unlocked ? 
              '<button class="garden-map-popup-btn sub" type="button" data-a="garden-copy-addr" data-v="'+esc(spot.address)+'" title="주소 복사" style="flex:0 0 38px;padding:0">'+

              '</button>' : 
              '<button class="garden-map-popup-btn sub" type="button" data-a="garden-unlock-open" data-id="'+esc(spot.id)+'" title="비밀번호 열람" style="flex:0 0 50px;font-size:11.5px;padding:0">'+
                '🔓 열람'+
              '</button>')+
          '</div>'+
        '</div>'+
      '</div>';

      marker.bindPopup(popupHtml);
      marker.spotId = spot.id;
      marker.addTo(gardenMapInstance);
      gardenMapMarkers.push(marker);
      markerObjects.push(marker);
    });

    if(ui.gardenMapFocusId){
      var targetM = gardenMapMarkers.find(function(m){ return m.spotId === ui.gardenMapFocusId; });
      if(targetM){
        setTimeout(function(){
          if(gardenMapInstance){
            gardenMapInstance.flyTo(targetM.getLatLng(), 13, { duration: 0.8 });
            targetM.openPopup();
          }
          ui.gardenMapFocusId = null;
        }, 120);
        return;
      }
    }

    if(markerObjects.length > 0){
      try {
        var group = L.featureGroup(markerObjects);
        gardenMapInstance.fitBounds(group.getBounds().pad(0.12));
      } catch(e){}
    }

    setTimeout(function(){
      if(gardenMapInstance) gardenMapInstance.invalidateSize();
    }, 150);
  }

  function formatChecklistText(onlyUnchecked){
    if(!list)return '';
    var lines=[];
    lines.push('⛺ [캠핑음식 도우미] '+list.dish+' ('+list.people+'명 기준)');
    if(list.summary||list.reason)lines.push(list.summary||list.reason);
    lines.push('');
    ['재료','장비','소모품'].forEach(function(g){
      var its=list.items.filter(function(x){return x.group===g&&(!onlyUnchecked||!x.checked)});
      if(!its.length)return;
      lines.push('■ '+g);
      its.forEach(function(x){
        var mark=x.checked?'[✓] ':'[ ] ';
        var amt=x.amount?' ('+x.amount+')':'';
        var tag=x.tag&&TAGS[x.tag]?' · '+TAGS[x.tag]:'';
        var alt=x.alt?' (대체: '+x.alt+')':'';
        lines.push(mark+x.text+amt+tag+alt);
      });
      lines.push('');
    });
    if(!onlyUnchecked&&list.prepTips&&list.prepTips.length){
      lines.push('■ 집에서 미리');
      list.prepTips.forEach(function(t){lines.push('- '+t)});
      lines.push('');
    }
    if(!onlyUnchecked&&list.steps&&list.steps.length){
      lines.push('■ 조리 순서');
      list.steps.forEach(function(t,idx){lines.push((idx+1)+'. '+t)});
    }
    return lines.join('\n').trim();
  }

  var noticeTimer = null;
  function showNotice(msg){
    if(noticeTimer) clearTimeout(noticeTimer);
    ui.notice=msg;
    render();
    noticeTimer = setTimeout(function(){
      if(ui.notice===msg){
        ui.notice='';
        render();
      }
    }, 2800);
  }

  async function copyChecklist(onlyUnchecked){
    var txt=formatChecklistText(onlyUnchecked);
    if(!txt)return;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(txt);
      }else{
        var ta=document.createElement('textarea');
        ta.value=txt;
        ta.style.position='fixed';
        ta.style.opacity='0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showNotice(onlyUnchecked?'남은 준비물만 클립보드에 복사했어요!':'전체 준비물 목록을 클립보드에 복사했어요!');
    }catch(e){
      showNotice('복사하지 못했어요. 다시 시도해 주세요.');
    }
  }

  async function shareChecklist(){
    var txt=formatChecklistText(false);
    if(!txt)return;
    if(navigator.share){
      try{
        await navigator.share({
          title:'[캠핑 준비물] '+list.dish,
          text:txt
        });
        return;
      }catch(e){
        if(e&&e.name==='AbortError')return;
      }
    }
    await copyChecklist(false);
  }

  function filterMatchesItem(x){
    if(ui.filter==='all')return true;

  function clampPeople(n){return Math.max(1,Math.min(20,n))}

  function copyToClipboard(text){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text);
    }else{
      var ta=document.createElement('textarea');
      ta.value=text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }

  function executeDeleteGarden(id, password){
    fetch('/api/secret-gardens/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ password: password })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.success){
        ui.gardenList = (ui.gardenList || []).filter(function(g){ return g.id !== id; });
        if(ui.gardenDetailModal && ui.gardenDetailModal.id === id) ui.gardenDetailModal = null;
        ui.gardenAuthModal = null;
        showNotice('🗑️ 비밀 스팟이 삭제되었습니다.');
        render();
      } else {
        alert(d.error || '삭제 실패: 비밀번호를 확인해주세요.');
      }
    })
    .catch(function(err){
      alert('삭제 처리 중 오류가 발생했습니다.');
    });
  }

  function executeEditGarden(id, updatedFields, password){
    fetch('/api/secret-gardens/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.assign({}, updatedFields, { password: password }))
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.success && d.garden){
        var idx = (ui.gardenList || []).findIndex(function(g){ return g.id === id; });
        if(idx >= 0) ui.gardenList[idx] = d.garden;
        if(ui.gardenDetailModal && ui.gardenDetailModal.id === id) ui.gardenDetailModal = d.garden;
        ui.gardenEditModal = null;
        ui.gardenEditUploadedPhoto = '';
        showNotice('🌿 스팟 정보가 성공적으로 수정되었습니다.');
        render();
      } else {
        alert(d.error || '수정 실패: 비밀번호 또는 입력값을 확인해주세요.');
      }
    })
    .catch(function(err){
      alert('수정 처리 중 오류가 발생했습니다.');
    });
  }

    if(a==='tab'){
      ui.tab=v;

    if(a==='garden-set-cat'){ui.gardenCategory=v;render();return}

      var idx=ui.gardenSelectedFacilities.indexOf(v);
      if(idx>=0)ui.gardenSelectedFacilities.splice(idx,1);
      else ui.gardenSelectedFacilities.push(v);
      render();return;

        return;
      }
      showNotice('📍 현재 GPS 위치를 찾는 중입니다…');

        var lat=pos.coords.latitude.toFixed(4);

        var lngIn=document.getElementById('g-in-lng');

        if(lngIn)lngIn.value=lng;
        if(addrIn&&!addrIn.value)addrIn.value='GPS 좌표 ('+lat+', '+lng+') 부근';
        showNotice('📍 GPS 위치 좌표가 자동으로 입력되었습니다.');
      },function(err){
        showNotice('위치 정보를 가져오지 못했습니다: '+(err.message||'브라우저 권한 허용 필요'));

    }
    if(a==='clear'){ui.confirmClear=true;render();return}
    if(a==='clear2'){list=null;store.set('cc.list',null);ui.confirmClear=false;ui.cookMode=false;render();return}
    if(a==='copylist'){copyChecklist(false);return}
    if(a==='copyunchecked'){copyChecklist(true);return}
    if(a==='sharelist'){shareChecklist();return}
    if(a==='pdec'){profile.people=clampPeople(profile.people-1);ui.people=profile.people;saveProfile();render();return}
    if(a==='pinc'){profile.people=clampPeople(profile.people+1);ui.people=profile.people;saveProfile();render();return}
    if(a==='gear'){
      var i=profile.gear.indexOf(v);
      if(i>=0)profile.gear.splice(i,1);else profile.gear.push(v);
      saveProfile();render();return;
    }
    if(a==='rmavoid'){profile.avoid=profile.avoid.filter(function(x){return x!==v});saveProfile();render();return}
    if(a==='clearrecent'){recent=[];store.set('cc.recent',recent);render();return}
  });

  document.addEventListener('input',function(e){
    if(!e.target||e.target.id!=='camp-search')return;
    ui.wxQ=e.target.value;
    ui.wxOpen=true;ui.wxIdx=-1;
    var q=str(ui.wxQ);
    if(q!==ui.placesQ){ui.places=[];ui.placesQ=q}
    clearTimeout(placeTimer);
    if(q.length>=2)placeTimer=setTimeout(function(){loadPlaces(q)},380);
    updateSuggest();
  });

  document.addEventListener('input',function(e){
    if(!e.target||e.target.id!=='camp-browse-search')return;
    ui.campSearch=e.target.value;
    ui.campPage=1;
    var listBox=document.getElementById('camp-list-box');
    var statLine=document.getElementById('camp-stat-line');
    if(listBox)listBox.innerHTML=renderCampCards();
    if(statLine){
      var filtered=getFilteredCamps(),pool=campPool();
      var my=ui.myLoc,curSort=ui.campSort||(my?'dist':'pop');
      statLine.innerHTML='<div style="font-size:13px;font-weight:700;color:var(--muted)">'+
        '검색 결과 <b style="color:var(--fg);font-size:15px">'+filtered.length+'</b>곳'+
        (pool.length!==filtered.length?' <small style="color:var(--muted)">(전체 '+pool.length+'곳)</small>':'')+
      '</div>'+
      '<div style="display:flex;gap:4px">'+
        (my?'<button class="chip sm" type="button" data-a="camp-sort" data-v="dist" aria-pressed="'+(curSort==='dist')+'">📍 가까운순</button>':'')+
        '<button class="chip sm" type="button" data-a="camp-sort" data-v="pop" aria-pressed="'+(curSort==='pop')+'">⭐ 추천순</button>'+
        '<button class="chip sm" type="button" data-a="camp-sort" data-v="name" aria-pressed="'+(curSort==='name')+'">🔤 이름순</button>'+
      '</div>';
    }
  });

  document.addEventListener('input',function(e){
    if(e.target && e.target.classList && e.target.classList.contains('price-input')) {
      var id = e.target.getAttribute('data-id');
      var value = e.target.value;
      if(list) {
        list.items.forEach(function(item) {
          if(item.id === id) {
            item.price = value;
          }
        });
        store.set('cc.list', list);
        var budgetEl = document.getElementById('total-budget-line');
        if(budgetEl) {
          budgetEl.textContent = '💰 총 예산: ' + formatCurrency(calculateTotalBudget());
        }
      }
    }
  });

  document.addEventListener('focusin',function(e){
    if(!e.target||e.target.id!=='camp-search')return;
    if(!ui.wxOpen){ui.wxOpen=true;ui.wxIdx=-1;updateSuggest()}
  });

  document.addEventListener('keydown',function(e){
    if(!e.target||e.target.id!=='camp-search')return;
    var box=document.getElementById('camp-ac');
    var open=!!(box&&!box.hidden);
    if(e.key==='ArrowDown'){e.preventDefault();if(!open){ui.wxOpen=true;updateSuggest()}else moveSuggest(1);return}
    if(e.key==='ArrowUp'){e.preventDefault();if(open)moveSuggest(-1);return}
    if(e.key==='Enter'){
      if(open&&ui.wxPick&&ui.wxPick.length){
        e.preventDefault();
        var idx=ui.wxIdx<0?0:ui.wxIdx;
        selectSuggest(ui.wxPick[idx]);
      }
      return;
    }
    if(e.key==='Escape'){ui.wxOpen=false;ui.wxIdx=-1;updateSuggest();return}
    if(e.key==='Tab'){ui.wxOpen=false;updateSuggest();return}
  });

  document.addEventListener('click',function(e){
    if(!e.target||!e.target.closest)return;
    if(e.target.closest('.ac-wrap'))return;
    if(ui.wxOpen){ui.wxOpen=false;ui.wxIdx=-1;updateSuggest()}
  });

  document.addEventListener('change',function(e){
    if(e.target&&e.target.id==='import-file'){
      var file=e.target.files&&e.target.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        try{
          var parsed=JSON.parse(String(ev.target.result||''));
          if(parsed.profile){profile=parsed.profile;store.set('cc.profile',profile);ui.people=profile.people||2}
          if(parsed.list!==undefined){list=parsed.list;store.set('cc.list',list)}
          if(Array.isArray(parsed.recent)){recent=parsed.recent;store.set('cc.recent',recent)}
          if(Array.isArray(parsed.logs)){logs=parsed.logs;store.set('cc.logs',logs)}
          if(Array.isArray(parsed.favCamps)){ui.favCamps=parsed.favCamps;store.set('cc.favCamps',ui.favCamps)}
          if(Array.isArray(parsed.gardenUnlockedIds)){ui.gardenUnlockedIds=parsed.gardenUnlockedIds;store.set('cc.gardenUnlocked',ui.gardenUnlockedIds)}
          showNotice('🎉 백업 데이터를 성공적으로 복원했습니다!');
          render();
        }catch(err){
          showNotice('올바른 백업 파일이 아니에요.');
        }
      };
      reader.readAsText(file);
      return;
    }

    if(e.target && (e.target.id === 'g-file-upload' || e.target.id === 'g-camera-upload')){
      var gFile = e.target.files && e.target.files[0];
      if(gFile){
        handleGardenPhotoUpload(gFile, false);
      }
    }

    if(e.target && (e.target.id === 'ge-file-upload' || e.target.id === 'ge-camera-upload')){
      var geFile = e.target.files && e.target.files[0];
      if(geFile){
        handleGardenPhotoUpload(geFile, true);
      }
    }
  });

  document.addEventListener('submit',function(e){
    var f=e.target.closest('[data-form]');
    if(!f)return;
    e.preventDefault();
    var kind=f.getAttribute('data-form');
    var input=f.querySelector('input');
    var val=str(input&&input.value);
    if(kind==='log'){
      if(!list)return;
      var today=new Date().toISOString().slice(0,10);
      logs.unshift({
        dish:list.dish,
        people:list.people,
        stars:ui.logStars||5,
        note:val,
        date:today
      });
      logs=logs.slice(0,30);
      store.set('cc.logs',logs);
      ui.logNote='';
      showNotice('캠핑 요리 일지에 저장했어요! (내 정보 탭에서 확인 가능)');
      return;
    }

    // === 나만의 비밀의 정원 폼 서브밋 핸들러 ===
    if(kind==='garden-register'){
      var nameIn = document.getElementById('g-in-name');
      var addrIn = document.getElementById('g-in-addr');
      var authorIn = document.getElementById('g-in-author');
      var pwdIn = document.getElementById('g-in-pwd');
      if(!nameIn || !nameIn.value.trim()){ alert('스팟 이름을 입력해주세요.'); return; }
      if(!addrIn || !addrIn.value.trim()){ alert('주소 및 위치를 입력해주세요.'); return; }
      if(!authorIn || !authorIn.value.trim()){ alert('작성자 닉네임을 입력해주세요.'); return; }
      if(!pwdIn || !pwdIn.value.trim()){ alert('비밀번호를 입력해주세요.'); return; }

      var photoCustom = document.getElementById('g-in-photo') ? document.getElementById('g-in-photo').value.trim() : '';
      var photoFinal = ui.gardenUploadedPhoto || photoCustom || ui.gardenSelectedPhoto || GARDEN_PHOTO_PRESETS[0].url;

      var newSpotData = {
        name: nameIn.value.trim(),
        category: ui.gardenCategory || 'noji',
        address: addrIn.value.trim(),
        addressDetail: document.getElementById('g-in-detail') ? document.getElementById('g-in-detail').value.trim() : '',
        lat: document.getElementById('g-in-lat') ? Number(document.getElementById('g-in-lat').value) || null : null,
        lng: document.getElementById('g-in-lng') ? Number(document.getElementById('g-in-lng').value) || null : null,
        navQuery: document.getElementById('g-in-nav') ? document.getElementById('g-in-nav').value.trim() : '',
        facilities: ui.gardenSelectedFacilities || [],
        groundType: document.getElementById('g-in-ground') ? document.getElementById('g-in-ground').value : '자갈/모래',
        fee: document.getElementById('g-in-fee') ? document.getElementById('g-in-fee').value.trim() : '무료',
        toiletStatus: document.getElementById('g-in-toilet') ? document.getElementById('g-in-toilet').value.trim() : '정보 없음',
        entryRoad: document.getElementById('g-in-road') ? document.getElementById('g-in-road').value.trim() : '일반 승용차 진입 가능',
        photoUrl: photoFinal,
        tips: document.getElementById('g-in-tips') ? document.getElementById('g-in-tips').value.trim() : '',
        author: authorIn.value.trim(),
        password: pwdIn.value.trim(),
        isPrivate: document.getElementById('g-in-isprivate') ? document.getElementById('g-in-isprivate').checked : true
      };

      fetch('/api/secret-gardens', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(newSpotData)
      })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.success && d.garden){
          ui.gardenRegModal = false;
          ui.gardenUploadedPhoto = '';
          ui.gardenCustomPhoto = '';
          ui.gardenList = ui.gardenList || [];
          ui.gardenList.unshift(d.garden);
          if(ui.gardenUnlockedIds.indexOf(d.garden.id) < 0) ui.gardenUnlockedIds.push(d.garden.id);
          store.set('cc.gardenUnlocked', ui.gardenUnlockedIds);
          showNotice('🌿 새로운 비밀의 정원이 등록되었습니다!');
          render();
        } else {
          alert(d.error || '등록 중 오류가 발생했습니다.');
        }
      })
      .catch(function(e){
        alert('서버 등록에 실패했습니다.');
      });
      return;
    }

    if(kind==='garden-unlock'){
      var sId = f.getAttribute('data-id');
      var unlockPwdIn = document.getElementById('g-unlock-pwd');
      var enteredPwd = unlockPwdIn ? unlockPwdIn.value.trim() : '';
      if(!enteredPwd) return;

      fetch('/api/secret-gardens/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: sId, password: enteredPwd })
      })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.success && d.garden){
          if(ui.gardenUnlockedIds.indexOf(sId) < 0) ui.gardenUnlockedIds.push(sId);
          store.set('cc.gardenUnlocked', ui.gardenUnlockedIds);

          var idx = (ui.gardenList || []).findIndex(function(g){ return g.id === sId; });
          if(idx >= 0) ui.gardenList[idx] = d.garden;
          ui.gardenDetailModal = d.garden;

          if(d.authorized || d.isMaster){
            ui.gardenIsMaster = true;
            ui.gardenMasterKey = enteredPwd;
            store.set('cc.gardenMasterKey', enteredPwd);
            loadSecretGardens(true);
            showNotice('🔓 상세 정보가 잠금 해제되었습니다!');
          } else {
            showNotice('🔓 상세 정보가 잠금 해제되었습니다!');
            render();
          }
        } else {
          alert(d.error || '비밀번호가 일치하지 않습니다.');
        }
      })
      .catch(function(e){
        alert('비밀번호 확인 중 오류가 발생했습니다.');
      });
      return;
    }

    if(kind==='garden-auth-submit'){
      if(!ui.gardenAuthModal) return;
      var authAction = ui.gardenAuthModal.action;
      var spotId = ui.gardenAuthModal.spotId;
      var authPwdIn = document.getElementById('g-auth-pwd-input');
      var authPwd = authPwdIn ? authPwdIn.value.trim() : '';

      if(authAction === 'delete'){
        executeDeleteGarden(spotId, authPwd);
      } else {
        fetch('/api/secret-gardens/verify', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id: spotId, password: authPwd })
        })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d.success && d.garden){
            ui.gardenAuthModal = null;
            if(ui.gardenUnlockedIds.indexOf(spotId) < 0) ui.gardenUnlockedIds.push(spotId);
            store.set('cc.gardenUnlocked', ui.gardenUnlockedIds);
            var idx = (ui.gardenList || []).findIndex(function(g){ return g.id === spotId; });
            if(idx >= 0) ui.gardenList[idx] = d.garden;
            ui.gardenDetailModal = d.garden;

            if(d.authorized || d.isMaster){
              ui.gardenIsMaster = true;
              ui.gardenMasterKey = authPwd;
              store.set('cc.gardenMasterKey', authPwd);
              loadSecretGardens(true);
            }

            if(authAction === 'edit'){
              ui.gardenEditModal = d.garden;
              ui.gardenEditUploadedPhoto = '';
              render();
            } else {
              showNotice('🔓 비밀의 정원이 잠금 해제되었습니다!');
              render();
            }
          } else {
            alert(d.error || '비밀번호가 일치하지 않습니다.');
          }
        })
        .catch(function(e){
          alert('비밀번호 확인 중 오류가 발생했습니다.');
        });
      }
      return;
    }

    if(kind==='garden-edit-save'){
      var editId = f.getAttribute('data-id');
      var editSpot = (ui.gardenList || []).find(function(g){ return g.id === editId; }) || ui.gardenEditModal;
      if(!editSpot) return;

      var edNameIn = document.getElementById('ge-name');
      var edCatIn = document.getElementById('ge-cat');
      var edAddrIn = document.getElementById('ge-addr');
      var edDetailIn = document.getElementById('ge-detail');
      var edGroundIn = document.getElementById('ge-ground');
      var edToiletIn = document.getElementById('ge-toilet');
      var edRoadIn = document.getElementById('ge-road');
      var edFeeIn = document.getElementById('ge-fee');
      var edTipsIn = document.getElementById('ge-tips');
      var edIsPrivIn = document.getElementById('ge-isprivate');
      var edNewPwdIn = document.getElementById('ge-newpwd');

      if(!edNameIn || !edNameIn.value.trim()){ alert('스팟 이름을 입력해주세요.'); return; }

      var selectedFacs = [];
      document.querySelectorAll('input[name="ge-facilities"]:checked').forEach(function(ck){
        selectedFacs.push(ck.value);
      });

      var updatedFields = {
        name: edNameIn.value.trim(),
        category: edCatIn ? edCatIn.value : editSpot.category,
        address: edAddrIn ? edAddrIn.value.trim() : editSpot.address,
        addressDetail: edDetailIn ? edDetailIn.value.trim() : editSpot.addressDetail,
        facilities: selectedFacs,
        groundType: edGroundIn ? edGroundIn.value : editSpot.groundType,
        toiletStatus: edToiletIn ? edToiletIn.value : editSpot.toiletStatus,
        entryRoad: edRoadIn ? edRoadIn.value : editSpot.entryRoad,
        fee: edFeeIn ? edFeeIn.value.trim() : editSpot.fee,
        tips: edTipsIn ? edTipsIn.value.trim() : editSpot.tips,
        isPrivate: edIsPrivIn ? edIsPrivIn.checked : editSpot.isPrivate
      };

      if(ui.gardenEditUploadedPhoto){
        updatedFields.photoUrl = ui.gardenEditUploadedPhoto;
      }
      if(edNewPwdIn && edNewPwdIn.value.trim()){
        updatedFields.newPassword = edNewPwdIn.value.trim();
      }

      var authKey = ui.gardenMasterKey || editSpot.password || '';
      executeEditGarden(editId, updatedFields, authKey);
      return;
    }

    if(!val)return;
    if(kind==='plan-custom'){selectSwapDish(val);return}
    if(kind==='modify'){ui.modText=val;modifyChecklist(val);return}
    if(kind==='dish'){ui.dishText=val;pickDish({name:val,minutes:0,level:'',equipment:[],reason:'직접 고른 요리'},false);return}
    if(kind==='gear'){if(profile.gear.indexOf(val)<0)profile.gear.push(val)}
    if(kind==='avoid'){if(profile.avoid.indexOf(val)<0)profile.avoid.push(val)}
    saveProfile();render();
  });

  document.addEventListener('input',function(e){
    if(e.target && e.target.id === 'garden-search-input'){
      ui.gardenSearch = e.target.value;
      render();
    }
  });

  render();
  (async function(){
    try{sampleFn=(window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){sampleFn=null}
    if(!sampleFn){
      sampleFn={
        json:async function(prompt,opts){
          try{
            var res=await fetch('/api/sample',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({prompt:prompt}),
              signal:opts&&opts.signal
            });
            var data=await res.json();
            if(!res.ok)throw {code:(data&&data.code)||'upstream_error'};
            return data;
          }catch(err){
            if(err&&err.name==='AbortError')throw {code:'cancelled'};
            if(err&&err.code)throw err;
            throw {code:'upstream_error'};
          }
        }
      };
    }
    ui.aiOk=!!sampleFn;

    var savedLoc=store.get('cc.loc',null);
    if(savedLoc&&savedLoc.lat&&savedLoc.lon)ui.myLoc=savedLoc;
    if(profile.camp&&profile.camp.lat!=null){
      ui.wxLoc={name:profile.camp.name,region:profile.camp.region||'',lat:profile.camp.lat,lon:profile.camp.lon,src:profile.camp.src||'data'};
      var cachedWx=store.get('cc.wx',null);
      if(cachedWx&&cachedWx.key===wxKey(ui.wxLoc)&&cachedWx.data){
        ui.wx=cachedWx.data;
        ui.wxKey=cachedWx.key;
        ui.wxStale=(Date.now()-(cachedWx.at||0))>3*3600*1000;
      }
      render();
      if(ui.myLoc)loadOsmNearby();
      if(!ui.wx||ui.wxStale)loadWeather();
      else updateSuggest();
    }else{
      render();
      if(ui.myLoc)loadOsmNearby();
    }
    loadSecretGardens(false);
  })();
})();
</script>

</body>
</html>
