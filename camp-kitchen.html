<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캠핑음식 도우미</title>
<meta name="description" content="장비와 인원만 고르면 메뉴 추천부터 준비물 체크리스트까지 정리해 주는 캠핑 요리 도우미 웹앱">
<meta property="og:title" content="캠핑음식 도우미">
<meta property="og:description" content="장비와 인원만 고르면 메뉴 추천부터 준비물 체크리스트까지 정리해 주는 캠핑 요리 도우미 웹앱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 폰 폭의 앱. 맨 위에 큰 색면 히어로, 아래로 둥근 카드, 하단에 떠 있는 알약 탭바.
   색: 깊은 숲 초록을 바탕 색면으로, 캠핑 불빛 같은 마리골드 노랑을 포인트로 쓴다. */
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --fg:#0F1F19; --muted:#5C6F66; --line:#DCE5E0; --chip:#E3EBE7;
  --brand:#12493A; --brand-fg:#FFFFFF; --hero-bg:#12493A; --hero-fg:#FFFFFF;
  --pop:#FFC531; --pop-fg:#2A1E00; --ember:#B3401A; --soft:#FFE9E0; --ok:#1E8A55;
  --shadow:0 6px 20px rgba(15,31,25,.08); --shadow-up:0 10px 30px rgba(15,31,25,.18);
  --font-display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1411; --surface:#14221D; --fg:#EAF3EE; --muted:#9CB1A7; --line:#243730; --chip:#1D2F28;
    --brand:#7FE0B5; --brand-fg:#06241A; --hero-bg:#1A5845; --hero-fg:#F2FBF6;
    --ember:#FF9A74; --soft:#2D1B14; --ok:#74D19B;
    --shadow:0 6px 20px rgba(0,0,0,.35); --shadow-up:0 10px 30px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#14221D; --fg:#EAF3EE; --muted:#9CB1A7; --line:#243730; --chip:#1D2F28;
  --brand:#7FE0B5; --brand-fg:#06241A; --hero-bg:#1A5845; --hero-fg:#F2FBF6;
  --ember:#FF9A74; --soft:#2D1B14; --ok:#74D19B;
  --shadow:0 6px 20px rgba(0,0,0,.35); --shadow-up:0 10px 30px rgba(0,0,0,.55); color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:14px 120px}
.app{max-width:560px;margin:0 auto;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:var(--font-body)}
@media (prefers-reduced-motion: no-preference){
  .btn,.chip,.step button,.tabs button{transition:transform .12s ease,background-color .15s ease}
  .btn:active,.chip:active,.step button:active{transform:scale(.97)}
}

/* 히어로 */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-fg);border-radius:28px;padding:20px 20px 22px;margin-bottom:16px;isolation:isolate}
.hero .scene{position:absolute;right:-6px;bottom:-2px;width:62%;max-width:300px;z-index:-1;opacity:.95}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:34px}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;opacity:.85;margin:0}
.season{font-size:12px;font-weight:900;background:var(--pop);color:var(--pop-fg);border-radius:999px;padding:5px 11px;white-space:nowrap}
.home h1{font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.12;letter-spacing:.01em;margin-bottom:10px}
.home h1 em{font-style:normal;color:var(--pop)}
.home p.sub{margin:0;max-width:17em;font-size:14px;opacity:.88}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 2px 16px}
.bar h1{font-size:28px;font-weight:900;letter-spacing:-.02em}

/* 카드와 입력 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:18px;font-weight:900;letter-spacing:-.01em;margin-bottom:14px}
.field{display:grid;gap:9px;margin-bottom:16px}
.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid transparent;background:var(--chip);color:var(--fg);font:500 14px/1 var(--font-body);min-height:44px;padding:0 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);font-weight:700}
.chip.sm{min-height:36px;padding:0 12px;font-size:13px}
.chip.x::after{content:" ×";opacity:.7}
.step{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px}
.step button{appearance:none;border:0;background:var(--surface);color:var(--fg);width:44px;height:44px;border-radius:50%;font:700 22px/1 var(--font-body);cursor:pointer;box-shadow:var(--shadow)}
.step output{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-weight:900;font-size:17px}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:700 15px/1 var(--font-body);min-height:52px;padding:0 20px;border-radius:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg);box-shadow:var(--shadow)}
.btn.pop{background:var(--pop);border-color:var(--pop);color:var(--pop-fg);box-shadow:var(--shadow)}
.btn.big{min-height:58px;font-size:16px;border-radius:20px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:20px;height:20px;fill:currentColor;flex:none}
.link{appearance:none;border:0;background:none;color:var(--brand);font:inherit;font-weight:900;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px}
.err{background:var(--soft);color:var(--ember);border:1.5px solid var(--ember);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14px;font-weight:500}
.banner{background:var(--chip);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sec-title{margin:22px 2px 10px}
.sec-title h2{font-size:20px;font-weight:900;letter-spacing:-.02em}

/* 추천 카드 */
.rec-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.rec h3{font-family:var(--font-display);font-weight:400;font-size:25px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.time{flex:none;background:var(--pop);color:var(--pop-fg);font-weight:900;font-size:14px;border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
.rec .why{margin:0 0 10px;color:var(--fg);font-weight:500}
.rec-meta-line{font-size:13px;color:var(--muted);margin:0 0 12px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rec-ings{background:var(--bg);border-radius:14px;padding:10px 12px;margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.5}
.rec-ings b{color:var(--fg);font-weight:700}

/* 직접 입력, 입력줄 */
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:16px;padding:0 14px;font:inherit}
.addrow .btn{min-height:48px;border-radius:16px}

/* 로딩 */
.loading{display:flex;align-items:center;gap:12px}
.loading p{margin:0;flex:1;min-width:0;font-weight:500}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;flex:none}
@media (prefers-reduced-motion: no-preference){.spin{animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}

/* 준비물 */
.dish{padding-bottom:20px}
.dish h2{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.15;margin:30px 0 8px;letter-spacing:.01em;overflow-wrap:anywhere}
.dish .sum{margin:0;opacity:.9;max-width:26em}
.dish-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dish-pill{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);color:var(--hero-fg);padding:4px 10px;border-radius:999px}
.prog{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:14px;font-variant-numeric:tabular-nums}
.prog b{font-size:20px;font-weight:900;color:var(--pop)}
.track{flex:1;height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--pop);border-radius:99px}
.group h3{font-size:17px;font-weight:900;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.group h3 small{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;cursor:pointer}
.item input{appearance:none;-webkit-appearance:none;position:relative;width:26px;height:26px;margin:0;border:2px solid var(--muted);border-radius:50%;background:transparent;cursor:pointer}
.item input:checked{background:var(--brand);border-color:var(--brand)}
.item input:checked::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--brand-fg);border-width:0 3px 3px 0;transform:rotate(45deg)}
.item .txt{min-width:0;overflow-wrap:anywhere}
.item .txt b{font-weight:700}
.item .txt small{display:block;color:var(--muted);font-size:13px}
.item .side{text-align:right;display:grid;gap:4px;justify-items:end}
.amt{font-variant-numeric:tabular-nums;font-weight:900;font-size:14px}
.tag{font-size:11px;font-weight:900;border-radius:999px;padding:3px 9px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.prep{background:var(--brand);color:var(--brand-fg)}
.tag.buy{background:var(--soft);color:var(--ember)}
.item.done .txt b{text-decoration:line-through;color:var(--muted);font-weight:500}
.plain{margin:0;padding-left:20px}
.plain li{margin-bottom:6px}
details summary{cursor:pointer;font-size:18px;font-weight:900;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:"＋";font-size:18px;color:var(--muted)}
details[open] summary::after{content:"－"}
details summary::-webkit-details-marker{display:none}
details ol{margin:14px 0 0;padding-left:22px}
details li{margin-bottom:8px}
.safety{background:var(--soft);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.safety h2{font-size:16px;font-weight:900;color:var(--ember);margin-bottom:8px}
.safety ul{margin:0;padding-left:18px;font-size:14px}
.empty{text-align:left;padding:26px 20px}
.empty h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 18px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 .btn{flex:1 1 140px}
.recent{margin:0;padding-left:20px;font-size:14px}

/* 현장 조리 모드 */
.cook-box{background:var(--hero-bg);color:var(--hero-fg);border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:var(--shadow-up)}
.cook-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.cook-badge{font-size:12px;font-weight:900;background:var(--pop);color:var(--pop-fg);padding:4px 10px;border-radius:999px}
.cook-step-txt{font-size:22px;font-weight:700;line-height:1.45;margin:14px 0 20px;word-break:keep-all}
.timer-bar{background:rgba(0,0,0,.22);border-radius:18px;padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.timer-display{display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer-clock{font-family:var(--font-display);font-size:36px;color:var(--pop);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.pairing-box{background:var(--bg);border-radius:16px;padding:12px 14px;margin-top:10px;font-size:14px}

/* 요리 일지 별점 */
.stars{display:inline-flex;gap:4px}
.star-btn{appearance:none;border:0;background:var(--chip);color:var(--muted);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.star-btn.on{background:var(--pop);color:var(--pop-fg)}
.log-item{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:4px}
.log-item:first-child{border-top:0;padding-top:0}

/* 캠핑지 찾기 · 자동완성 */
.loc-card{overflow:visible}
.ac-wrap{position:relative}
.loc-row{display:flex;gap:8px;align-items:stretch}
.loc-input{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:16px;padding:0 14px;font:inherit}
.loc-row .btn{min-height:48px;border-radius:16px;white-space:nowrap}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-up);max-height:min(56vh,360px);overflow-y:auto}
.ac-list[hidden]{display:none}
.ac-list::-webkit-scrollbar{width:8px}
.ac-sec{padding:8px 12px 4px;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.04em}
.ac-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer}
.ac-item b{display:block;font-weight:700;overflow-wrap:anywhere}
.ac-item small{display:block;color:var(--muted);font-size:12px}
.ac-item .ac-dist{font-size:12px;font-weight:900;color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (hover:hover){.ac-item:hover{background:var(--chip)}}
.ac-item[aria-selected="true"]{background:var(--chip)}
.ac-item[data-src="osm"] .ac-dist::after,.ac-item[data-src="geo"] .ac-dist::after{content:" · 실시간";font-size:11px;color:var(--muted)}
.ac-item[data-src="gps"] .ac-dist::after{content:" · GPS";font-size:11px;color:var(--muted)}
.ac-note{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.45}
.ac-note .chip{margin-left:auto}
.picked{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--chip);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px}
.picked small{color:var(--muted);font-size:12px}
.picked b{font-weight:900}

/* 캠핑지 날씨 */
.wx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.wx-tags{display:flex;gap:6px;flex-wrap:wrap}
.wx-tag{font-size:12px;font-weight:900;border-radius:999px;padding:4px 10px;background:var(--pop);color:var(--pop-fg);white-space:nowrap}
.wx-tag.warn{background:var(--soft);color:var(--ember)}
.wx-now{display:flex;align-items:center;gap:12px;margin-top:14px}
.wx-ico{font-size:38px;line-height:1}
.wx-temp{font-family:var(--font-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums;margin-right:8px}
.wx-feels{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.wx-cond{margin-left:auto;text-align:right;font-size:15px}
.wx-cond small{color:var(--muted);font-size:12px}
.wx-loc{font-size:13px;color:var(--muted);margin:12px 0 0;overflow-wrap:anywhere}
.wx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.wx-cell{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center;font-size:11px;color:var(--muted)}
.wx-cell b{display:block;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:2px}
.wx-hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.wx-hour{flex:none;min-width:62px;background:var(--bg);border-radius:14px;padding:8px 6px;text-align:center;font-size:11px;color:var(--muted)}
.wx-hour b{display:block;font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums}
.wx-hour small{display:block;font-size:11px}
.wx-h-ic{font-size:15px;line-height:1.4}
.wx-days{display:grid;gap:7px;margin-top:12px}
.wx-day{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.wx-d-plus{white-space:nowrap;font-weight:700}
.wx-d-bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;display:block}
.wx-d-bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(90,150,220,.75),rgba(255,197,49,.95));border-radius:99px}
.wx-d-temp{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.wx-tip{background:var(--soft);border-radius:16px;padding:12px 14px;margin:14px 0 0;font-size:13px;color:var(--ember);font-weight:500;line-height:1.5}
.wx-h3{font-size:16px;font-weight:900;margin:18px 0 0}
.wx-menu{display:grid;gap:8px;margin-top:10px}
.wx-menu-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg);border:1.5px solid transparent;border-radius:16px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:var(--fg)}
@media (hover:hover){.wx-menu-item:hover{border-color:var(--brand)}}
.wx-menu-item b{font-weight:700}
.wx-menu-item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.wx-menu-item .go{font-size:12px;font-weight:900;color:var(--brand);white-space:nowrap}
.wx-strip{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media (max-width:420px){.wx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 하단 알약 탭바 */
.tabs{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.pill{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow-up)}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font:700 13px/1 var(--font-body);min-height:48px;border-radius:999px;cursor:pointer}
.tabs button[aria-current="page"]{background:var(--brand);color:var(--brand-fg)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" aria-label="화면 이동"><div class="pill">
  <button type="button" data-a="tab" data-v="rec"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>추천</button>
  <button type="button" data-a="tab" data-v="list"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>준비물</button>
  <button type="button" data-a="tab" data-v="me"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20L12 4l9 16H3z"/><path d="M12 20v-7"/></svg>내 정보</button>
</div></nav>

<script src="data/campgrounds.js"></script>
<script>
(function(){
  var STYLES=['오토캠핑','차박','백패킹','솔캠'];

  function wxActiveTags(){
    var wx=profile.wxAware?wxContext():null;
    return wx?wx.info.tags:[];
  }
  var wxAllMenuNames=null;
  function wxWithOtherRule(name,tags){
    if(!wxAllMenuNames){
      wxAllMenuNames={};
      Object.keys(WX_RULES).forEach(function(k){
        wxMenuNames(k).forEach(function(n){wxAllMenuNames[n]=1});
      });
    }
    return !!wxAllMenuNames[name]&&!tags.some(function(t){return wxMenuNames(t).indexOf(name)>=0});
  }
  function wxRecipeScore(name){
    var tags=wxActiveTags();
    if(!tags.length)return {score:0,hit:false,tag:null};
    for(var i=0;i<tags.length;i++){
      if(wxMenuNames(tags[i]).indexOf(name)>=0)return {score:(i===0?22:14),hit:true,tag:tags[i]};
    }
    if(wxWithOtherRule(name,tags))return {score:-10,hit:false,tag:null};
    return {score:0,hit:false,tag:null};
  }

  function formatScaledIngredients(baseArr,people){
    if(!Array.isArray(baseArr)||!baseArr.length)return '';
    return baseArr.map(function(item){
      var total=Math.round(item.q*people*10)/10;
      return item.n+' '+total+item.u;
    }).join(' · ');
  }

  function matchLocalRecs(people,userGear,meal,mood,avoidArr,excludeNames){
    var gSet=userGear.length?userGear:['버너','코펠'];
    var favNames=logs.filter(function(l){return l.stars>=4}).map(function(l){return l.dish});
    var scored=CAMP_RECIPES.filter(function(r){
      if(excludeNames&&excludeNames.indexOf(r.name)>=0)return false;
      var fullText=r.name+' '+r.base.map(function(b){return b.n}).join(' ');
      for(var i=0;i<avoidArr.length;i++){
        if(avoidArr[i]&&fullText.indexOf(avoidArr[i])>=0)return false;
      }
      return true;
    }).map(function(r){
      var matchedGear=r.equipment.filter(function(eq){return gSet.indexOf(eq)>=0});
      var score=matchedGear.length*15;
      if(matchedGear.length===r.equipment.length)score+=20;
      if(r.meals.indexOf(meal)>=0)score+=10;
      if(r.moods.indexOf(mood)>=0)score+=10;
      if(favNames.indexOf(r.name)>=0)score+=12;
      if(people>=4&&(r.name.indexOf('찌개')>=0||r.name.indexOf('삼겹')>=0||r.name.indexOf('바비큐')>=0))score+=8;
      if(people===1&&(r.minutes<=20))score+=8;
      var wxs=wxRecipeScore(r.name);
      score+=wxs.score;
      var wxNote=wxs.hit?(' '+WX_RULES[wxs.tag].icon+' '+WX_RULES[wxs.tag].label+' 날씨에 특히 맞아요.'):'';
      var activeEquip=matchedGear.length?matchedGear:r.equipment.slice(0,2);
      return {
        score:score,
        rec:{
          name:r.name,
          minutes:r.minutes,
          level:r.level,
          equipment:activeEquip,
          people:people,
          ingredientsPreview:formatScaledIngredients(r.base,people),
          reason:people+'명 기준 · 보유하신 '+activeEquip.join(', ')+' 장비에 딱 맞는 요리예요. '+r.reason+wxNote
        }
      };
    });
    scored.sort(function(a,b){return b.score-a.score});
    return scored.slice(0,3).map(function(x){return x.rec});
  }

  async function getRecs(more){

        };

      });
    }else{

      items.push({id:'i'+(n++),group:'재료',text:'양파·대파·마늘',amount:(people*50)+'g',price:'',alt:'쪽파',tag:'prep',checked:false});
    }
    items.push({id:'i'+(n++),group:'재료',text:'소금·후추·식용유',amount:'적당량',price:'',alt:'허브솔트',tag:'pack',checked:false});
    items.push({id:'i'+(n++),group:'재료',text:'생수·얼음·쌈채소',amount:people+'인분',price:'',alt:'',tag:'buy',checked:false});

    ['집게·가위','앞접시·수저','물티슈·키친타월','종이호일·지퍼백'].forEach(function(s){

      ],

        '예열된 조리 도구에 주재료를 올리고 중불에서 10분간 타지 않게 익혀 주세요.',
        '고기·해산물 등 주재료는 속까지 완전히 익었는지 확인한 뒤 채소와 함께 5분간 더 볶아 완성합니다.'
      ],

        '야외에서는 바람 때문에 화력이 약해질 수 있으니 방풍판을 함께 사용하면 조리 시간이 줄어들어요.'

  function sumAmounts(a1,a2){
    if(!a1)return a2||'';
    if(!a2)return a1||'';
    if(a1===a2&&a1==='적당량')return '적당량';
    var m1=String(a1).match(/^([0-9.]+)\s*(.*)$/);
    var m2=String(a2).match(/^([0-9.]+)\s*(.*)$/);
    if(m1&&m2&&m1[2]===m2[2]){
      var sum=Math.round((Number(m1[1])+Number(m2[1]))*10)/10;
      return sum+m1[2];
    }
    return a1+' + '+a2;
  }

  function formatCurrency(amount) {
    if(amount === 0 || !amount) return '0원';
    return new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW', currencyDisplay: 'narrowSymbol' }).format(amount);
  }

  function calculateTotalBudget() {
    if(!list)return 0;
    var total = 0;
    list.items.forEach(function(item) {
      if(item.group==='재료' && item.price) {
        var price = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
        total += price;
      }
    });
    return total;
  }

  async function generateRecipeImage(dishName) {
    try {
      var response = await fetch('/api/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: 'High-quality photo of Korean camping food: ' + dishName + ', delicious, appetizing, professional food photography, outdoor camping setting, natural lighting, 4K' })
      });
      if(response.ok) {
        var data = await response.json();
        return data.imageUrl;
      }
    } catch(e) {
      console.error('Image generation failed:', e);
    }
    return null;

  var recipeImagesCache = {};
  async function getRecipeImageUrl(dishName) {
    if(recipeImagesCache[dishName]) {
      return recipeImagesCache[dishName];
    }
    var url = await generateRecipeImage(dishName);
    if(url) {
      recipeImagesCache[dishName] = url;
    }
    return url;

  function mergePrepLists(cur,incoming){
    if(!cur)return incoming;
    var dishes=(cur.dishes&&cur.dishes.length?cur.dishes.slice():[cur.dish]);
    var incDishes=(incoming.dishes&&incoming.dishes.length?incoming.dishes:[incoming.dish]);
    incDishes.forEach(function(d){if(dishes.indexOf(d)<0)dishes.push(d)});

    var mergedItems=cur.items.map(function(x){return Object.assign({},x)});
    var maxId=mergedItems.length;
    incoming.items.forEach(function(item){
      var existing=null;
      for(var i=0;i<mergedItems.length;i++){
        if(mergedItems[i].group===item.group&&mergedItems[i].text===item.text){
          existing=mergedItems[i];break;
        }
      }
      if(existing){
        if(item.group==='재료'){
          existing.amount=sumAmounts(existing.amount,item.amount);
        }
      }else{
        var copyItem=Object.assign({},item,{id:'i'+(maxId++)});
        mergedItems.push(copyItem);
      }
    });

    var prepTips=(cur.prepTips||[]).slice();
    (incoming.prepTips||[]).forEach(function(t){if(prepTips.indexOf(t)<0)prepTips.push(t)});

    var steps=(cur.steps||[]).slice();
    (incoming.steps||[]).forEach(function(s){
      var labeled='['+incoming.dish+'] '+s;
      if(steps.indexOf(s)<0&&steps.indexOf(labeled)<0)steps.push(labeled);
    });

    var tips=(cur.tips||[]).slice();
    (incoming.tips||[]).forEach(function(t){if(tips.indexOf(t)<0)tips.push(t)});

    return {
      dish:dishes.join(' + '),
      dishes:dishes,
      reason:dishes.length+'가지 캠핑 코스 요리 합산 준비물',
      people:incoming.people||cur.people,
      summary:dishes.length+'가지 메뉴 통합 체크리스트 ('+(incoming.people||cur.people)+'명 기준)',
      pairing:[cur.pairing,incoming.pairing].filter(Boolean).join(' / '),
      items:mergedItems,
      prepTips:prepTips.slice(0,5),
      steps:steps.slice(0,12),
      tips:tips.slice(0,4)
    };
  }

  function checkEquipmentMatch(recEquipment, userEquipment) {
    var required = recEquipment || [];
    var userGear = userEquipment || profile.gear || [];
    var missing = required.filter(function(eq) { return userGear.indexOf(eq) < 0; });
    return { missing: missing, hasMissing: missing.length > 0, matched: required.filter(function(eq) { return userGear.indexOf(eq) >= 0; }) };
  }

  async function pickDish(rec,mergeMode){
    if(!rec||ui.busy)return;
    
    var eqCheck = checkEquipmentMatch(rec.equipment, profile.gear);
    if(eqCheck.hasMissing) {
      var missingText = eqCheck.missing.join(', ');
      showNotice('⚠️ 부족한 장비: ' + missingText + '. 이 요리를 만들려면 추가 장비가 필요해요!');
    }
    
    if(!sampleFn){
      var nextList=buildLocalPrepList(rec,ui.people,profile.gear);
      list=mergeMode&&list?mergePrepLists(list,nextList):nextList;
      store.set('cc.list',list);
      recent=[rec.name].concat(recent.filter(function(r){return r!==rec.name})).slice(0,8);
      store.set('cc.recent',recent);
      ui.tab='list';ui.confirmClear=false;ui.dishText='';ui.cookStep=0;window.scrollTo(0,0);
      if(mergeMode)showNotice('「'+rec.name+'」 준비물을 기존 목록에 합산했어요!');
      else render();
      return;
    }
    ctl=new AbortController();
    ui.busy='prep';ui.busyName=rec.name;ui.err='';render();
    try{
      var d=await sampleFn.json(prepPrompt(rec),{signal:ctl.signal,cache:false});
      var items=[],n=0;
      (Array.isArray(d&&d.ingredients)?d.ingredients:[]).forEach(function(x){
        var name=str(x&&x.name);if(!name)return;
        items.push({id:'i'+(n++),group:'재료',text:name,amount:str(x.amount),alt:str(x.alt),tag:TAGS[x.when]?x.when:'pack',checked:false});
      });
      (Array.isArray(d&&d.equipment)?d.equipment:[]).forEach(function(x){
        var o=nm(x);if(!o.name)return;
        items.push({id:'i'+(n++),group:'장비',text:o.name,amount:'',alt:o.alt,tag:'',checked:false});
      });
      (Array.isArray(d&&d.supplies)?d.supplies:[]).forEach(function(x){
        var o=nm(x);if(!o.name)return;
        items.push({id:'i'+(n++),group:'소모품',text:o.name,amount:'',alt:'',tag:'',checked:false});
      });
      if(!items.length)throw {code:'invalid_json'};
      var built={
        dish:rec.name,
        dishes:[rec.name],
        reason:rec.reason,
        people:ui.people,
        summary:str(d.summary),
        pairing:str(d.pairing)||'시원한 맥주·하이볼과 잘 어울려요.',
        items:items,
        prepTips:strs(d.prep_tips,3),
        steps:strs(d.steps,6),
        tips:strs(d.tips,2)
      };
      list=mergeMode&&list?mergePrepLists(list,built):built;
      store.set('cc.list',list);
      recent=[rec.name].concat(recent.filter(function(r){return r!==rec.name})).slice(0,8);
      store.set('cc.recent',recent);
      ui.tab='list';ui.confirmClear=false;ui.dishText='';ui.cookStep=0;window.scrollTo(0,0);
      if(mergeMode)showNotice('「'+rec.name+'」 준비물을 기존 목록에 합산했어요!');
    }catch(e){
      if(!e||e.code!=='cancelled'){
        var fallbackList=buildLocalPrepList(rec,ui.people,profile.gear);
        list=mergeMode&&list?mergePrepLists(list,fallbackList):fallbackList;
        store.set('cc.list',list);
        recent=[rec.name].concat(recent.filter(function(r){return r!==rec.name})).slice(0,8);
        store.set('cc.recent',recent);
        ui.tab='list';ui.confirmClear=false;ui.dishText='';ui.cookStep=0;window.scrollTo(0,0);
        if(mergeMode)showNotice('「'+rec.name+'」 준비물을 기존 목록에 합산했어요!');
      }
    }finally{ui.busy=null;ctl=null;render()}
  }

  function applyLocalModify(curList,text){
    if(!curList)return;
    var t=str(text);
    if(!t)return;
    var oldP=curList.people||2;
    var pMatch=t.match(/(\d+)\s*명/);
    if(t.indexOf('한 명 늘')>=0||t.indexOf('+1명')>=0||t.indexOf('1명 추가')>=0){
      pMatch=[null,String(oldP+1)];
    }else if(t.indexOf('한 명 줄')>=0||t.indexOf('-1명')>=0){
      pMatch=[null,String(Math.max(1,oldP-1))];
    }
    if(pMatch){
      var newP=clampPeople(Number(pMatch[1])||oldP);
      var ratio=newP/oldP;
      curList.people=newP;
      ui.people=newP;
      curList.items.forEach(function(item){
        if(item.group==='재료'&&item.amount){
          item.amount=String(item.amount).replace(/([0-9.]+)/g,function(num){
            return String(Math.round(Number(num)*ratio*10)/10);
          });
        }
      });
      curList.summary=newP+'명 기준으로 수량을 조정한 준비물이에요.';
      showNotice(newP+'명 기준으로 재료 수량을 즉시 변경했어요!');
      return;
    }

    var repMatch=t.match(/(.+?)\s*(?:대신|빼고)\s*(.+?)(?:으로|로)?\s*(?:바꿔|변경|대체)?$/);
    if(repMatch){
      var fromWord=str(repMatch[1]);
      var toWord=str(repMatch[2]).replace(/(으로|로|바꿔줘|바꿔|변경|추가)$/,'').trim();
      var changed=false;
      curList.items.forEach(function(item){
        if(item.text.indexOf(fromWord)>=0){
          item.text=item.text.replace(fromWord,toWord);
          changed=true;
        }
      });
      if(!changed){
        curList.items.unshift({id:'i'+Date.now(),group:'재료',text:toWord,amount:curList.people+'인분',alt:fromWord+' 대체',tag:'pack',checked:false});
      }
      showNotice('「'+fromWord+'」 대신 「'+toWord+'」(으)로 준비물을 수정했어요!');
      return;
    }

    if(t.indexOf('집에서 다 손질')>=0||t.indexOf('미리 손질')>=0){
      curList.items.forEach(function(item){if(item.group==='재료')item.tag='prep'});
      showNotice('모든 재료를 [집에서 미리 손질]로 변경했어요!');
      return;
    }

    if(t.indexOf('매운')>=0||t.indexOf('아이')>=0||t.indexOf('순한')>=0){
      curList.items=curList.items.filter(function(item){return item.text.indexOf('청양고추')<0&&item.text.indexOf('매운')<0});
      curList.tips=(curList.tips||[]).concat(['아이와 함께 먹을 수 있도록 매운 고추·향신료는 빼거나 따로 곁들이세요.']);
      showNotice('매운 재료를 빼고 순한 맛 기준으로 조정했어요!');
      return;
    }

    if(t.indexOf('빼줘')>=0||t.indexOf('제외')>=0||t.indexOf('없어')>=0){
      var target=t.replace(/(빼줘|제외해줘|제외|없어|요|음)$/g,'').trim();
      var beforeLen=curList.items.length;
      curList.items=curList.items.filter(function(x){return x.text.indexOf(target)<0});
      if(curList.items.length<beforeLen){
        showNotice('「'+target+'」 항목을 목록에서 뺐어요!');
        return;
      }
    }

    var cleanAdd=t.replace(/(추가해줘|추가|넣어줘|도 챙겨줘)$/,'').trim();
    curList.items.unshift({
      id:'i'+Date.now(),
      group:'재료',
      text:cleanAdd,
      amount:curList.people+'인분',
      alt:'',
      tag:'pack',
      checked:false
    });
    showNotice('「'+cleanAdd+'」 항목을 준비물에 반영했어요!');
  }

  async function modifyChecklist(reqText){
    if(!list||ui.busy)return;
    var clean=str(reqText);
    if(!clean)return;
    if(!sampleFn){
      applyLocalModify(list,clean);
      store.set('cc.list',list);
      ui.modText='';
      render();
      return;
    }
    ctl=new AbortController();
    ui.busy='mod';ui.err='';render();
    try{
      var d=await sampleFn.json(modifyPrompt(list,clean),{signal:ctl.signal,cache:false});
      var items=[],n=0;
      (Array.isArray(d&&d.ingredients)?d.ingredients:[]).forEach(function(x){
        var name=str(x&&x.name);if(!name)return;
        items.push({id:'i'+(n++),group:'재료',text:name,amount:str(x.amount),alt:str(x.alt),tag:TAGS[x.when]?x.when:'pack',checked:false});
      });
      (Array.isArray(d&&d.equipment)?d.equipment:[]).forEach(function(x){
        var o=nm(x);if(!o.name)return;
        items.push({id:'i'+(n++),group:'장비',text:o.name,amount:'',alt:o.alt,tag:'',checked:false});
      });
      (Array.isArray(d&&d.supplies)?d.supplies:[]).forEach(function(x){
        var o=nm(x);if(!o.name)return;
        items.push({id:'i'+(n++),group:'소모품',text:o.name,amount:'',alt:'',tag:'',checked:false});
      });
      if(!items.length)throw {code:'invalid_json'};
      list.people=clampPeople(Number(d.people)||list.people);
      ui.people=list.people;
      list.summary=str(d.summary)||list.summary;
      list.items=items;
      if(Array.isArray(d.prep_tips)&&d.prep_tips.length)list.prepTips=strs(d.prep_tips,4);
      if(Array.isArray(d.steps)&&d.steps.length)list.steps=strs(d.steps,8);
      if(Array.isArray(d.tips)&&d.tips.length)list.tips=strs(d.tips,3);
      store.set('cc.list',list);
      ui.modText='';
      showNotice('요청하신 내용으로 준비물과 조리 순서를 수정했어요!');
    }catch(e){
      if(!e||e.code!=='cancelled'){
        applyLocalModify(list,clean);
        store.set('cc.list',list);
        ui.modText='';
      }
    }finally{ui.busy=null;ctl=null;render()}
  }

  function detectStepSeconds(stepText){
    if(!stepText)return 180;
    var minMatch=String(stepText).match(/(\d+)\s*분/);
    if(minMatch)return Math.min(3600,Math.max(30,Number(minMatch[1])*60));
    var secMatch=String(stepText).match(/(\d+)\s*초/);
    if(secMatch)return Math.min(3600,Math.max(10,Number(secMatch[1])));
    return 180;
  }

  function formatTimer(sec){
    var s=Math.max(0,Math.floor(sec));
    var m=Math.floor(s/60);
    var r=s%60;
    return (m<10?'0'+m:m)+':'+(r<10?'0'+r:r);
  }

  function toggleTimer(){
    if(ui.timerRunning){
      clearInterval(timerId);
      timerId=null;
      ui.timerRunning=false;
      render();
      return;
    }
    if(ui.timerSec<=0)ui.timerSec=180;
    ui.timerRunning=true;
    timerId=setInterval(function(){
      if(ui.timerSec>0){
        ui.timerSec--;
        var clockEl=document.getElementById('cook-timer-clock');
        if(clockEl)clockEl.textContent=formatTimer(ui.timerSec);
        if(ui.timerSec===0){
          clearInterval(timerId);
          timerId=null;
          ui.timerRunning=false;
          if(navigator.vibrate)navigator.vibrate([250,120,250]);
          showNotice('⏰ 타이머가 끝났어요! 불 세기와 익힘 정도를 확인하세요.');
        }
      }
    },1000);
    render();
  }

  async function toggleWakeLock(enable){
    if(!('wakeLock' in navigator))return;
    try{
      if(enable&&!wakeLockSentinel){
        wakeLockSentinel=await navigator.wakeLock.request('screen');
        ui.wakeLockOn=true;
        wakeLockSentinel.addEventListener('release',function(){
          wakeLockSentinel=null;
          ui.wakeLockOn=false;
        });
      }else if(!enable&&wakeLockSentinel){
        await wakeLockSentinel.release();
        wakeLockSentinel=null;
        ui.wakeLockOn=false;
      }
    }catch(e){
      ui.wakeLockOn=false;
    }
  }

  function speakStep(text){
    if(!('speechSynthesis' in window)){
      showNotice('이 브라우저는 음성 변환(TTS)을 지원하지 않아요.');
      return;
    }
    window.speechSynthesis.cancel();
    if(!text){
      ui.ttsSpeaking=false;
      render();
      return;
    }
    var clean=String(text).replace(/\[.*?\]/g,'').replace(/^[0-9]+\.\s*/,'').trim();
    var u=new SpeechSynthesisUtterance(clean);
    u.lang='ko-KR';
    u.rate=0.95;
    u.pitch=1.0;
    ui.ttsSpeaking=true;
    u.onend=function(){ui.ttsSpeaking=false;render();};
    u.onerror=function(){ui.ttsSpeaking=false;render();};
    window.speechSynthesis.speak(u);
    render();
  }

  function stopTTS(){
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
    }
    ui.ttsSpeaking=false;
  }

  function chips(act,arr,cur){

  }

  /* ---------- 캠핑장 데이터(로컬 번들) ---------- */
  var campCache=null;
  function camps(){
    if(campCache)return campCache;
    var raw=(typeof window!=='undefined'&&window.CAMP_GROUNDS_DATA)||null;
    var sido=(raw&&raw.sido)||SIDO_FALLBACK, kinds=(raw&&raw.kinds)||KIND_FALLBACK;
    campCache={sido:sido,kinds:kinds,list:[]};
    if(!raw||!raw.rows)return campCache;
    raw.rows.split('\n').forEach(function(line){
      if(!line)return;
      var p=line.split('|');
      if(p.length<5)return;
      var ll=p[3].split(',');
      var lat=Number(ll[0]),lon=Number(ll[1]);
      if(!isFinite(lat)||!isFinite(lon)||!lat||!lon)return;
      var mask=parseInt(p[4],36)||1,sname=sido[parseInt(p[2],36)]||'';
      campCache.list.push({name:p[0],sido:sname,sg:p[1],region:(sname+' '+p[1]).trim(),lat:lat,lon:lon,kind:mask,kindText:kindText(mask),src:'data'});
    });
    return campCache;
  }
  function kindText(mask){
    var out=[];
    camps().kinds.forEach(function(k){if(mask&k[0])out.push(k[1])});
    return out.join('·')||'야영장';
  }
  var CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  function initials(s){
    var out='';
    String(s).split('').forEach(function(ch){
      var code=ch.charCodeAt(0)-0xAC00;
      out+=(code<0||code>11171)?ch:CHO.charAt(Math.floor(code/588));
    });
    return out;
  }
  function distKm(a,b){
    var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180;
    var la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
    var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
  }
  function fmtKm(km){
    if(km==null||!isFinite(km))return '';
    if(km<1)return Math.max(10,Math.round(km*1000/10)*10)+'m';
    if(km<10)return (Math.round(km*10)/10)+'km';
    return Math.round(km)+'km';
  }
  function campMatch(c,q){
    var name=String(c.name).replace(/\s+/g,''),nq=String(q).replace(/\s+/g,'');
    if(nq.length<1)return 0;
    if(name.indexOf(nq)===0)return 100;
    if(name.indexOf(nq)>0)return 80;
    if(initials(name).indexOf(initials(nq))===0)return 55;
    if(String(c.sg||'').indexOf(nq)>=0||String(c.sido||'').indexOf(nq)>=0)return 45;
    if(String(c.region||'').indexOf(nq)>=0)return 35;
    return 0;
  }
  /* 번들 데이터 + 실시간(OSM) 결과를 합친 목록 */
  function campPool(){
    var pool=camps().list.slice(),seen={};
    pool.forEach(function(c){seen[c.name.replace(/\s+/g,'')]=1});
    (ui.osmCamps||[]).forEach(function(c){
      if(seen[c.name.replace(/\s+/g,'')])return;
      seen[c.name.replace(/\s+/g,'')]=1;
      pool.push(c);
    });
    return pool;
  }
  function nearbyCamps(loc,limit,maxKm){
    var arr=campPool().map(function(c){return {c:c,d:distKm(loc,c)}}).filter(function(x){return x.d<=(maxKm||80)});
    arr.sort(function(a,b){return a.d-b.d});
    return arr.slice(0,limit||8).map(function(x){return x.c});
  }

  /* ---------- 네트워크 도우미 ---------- */
  function fetchTimeout(url,ms,opts){
    var ac=new AbortController();
    var timer=setTimeout(function(){ac.abort()},ms||12000);
    return fetch(url,Object.assign({signal:ac.signal},opts||{})).then(
      function(r){clearTimeout(timer);return r},
      function(e){clearTimeout(timer);throw e}
    );
  }

  /* ---------- 현재 위치 ---------- */
  function getMyLocation(){
    return new Promise(function(resolve,reject){
      if(!navigator.geolocation){reject('unsupported');return}
      navigator.geolocation.getCurrentPosition(
        function(pos){resolve({lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy,at:Date.now()})},
        function(){reject('denied')},
        {enableHighAccuracy:false,timeout:9000,maximumAge:600000}
      );
    });
  }
  async function useMyLocation(){

  /* ---------- 실시간 주변 야영지(OpenStreetMap Overpass) ---------- */
  async function loadOsmNearby(force){
    var loc=ui.myLoc;
    if(!loc)return;
    var key=loc.lat.toFixed(2)+','+loc.lon.toFixed(2);
    var cached=store.get('cc.osm',null);
    if(!force&&cached&&cached.key===key&&Date.now()-(cached.at||0)<12*3600*1000){
      ui.osmCamps=cached.list||[];
      return;
    }
    ui.osmBusy=true;updateSuggest();
    try{
      var at=loc.lat.toFixed(4)+','+loc.lon.toFixed(4);
      var q='[out:json][timeout:18];(node["tourism"="camp_site"](around:30000,'+at+');way["tourism"="camp_site"](around:30000,'+at+'););out center 80;';
      var res=await fetchTimeout('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),16000);
      var d=await res.json();
      var out=[];
      ((d&&d.elements)||[]).forEach(function(el){
        var t=el.tags||{},nm=str(t.name||t['name:ko']||'');
        if(!nm)return;
        var lat=(el.lat!=null?el.lat:(el.center&&el.center.lat));
        var lon=(el.lon!=null?el.lon:(el.center&&el.center.lon));
        if(lat==null||lon==null)return;
        out.push({name:nm,sido:'',sg:'',region:(t['addr:province']||t['addr:city']||'실시간 지도(OSM)'),lat:lat,lon:lon,kind:0,kindText:'야영지(OSM)',src:'osm'});
      });
      ui.osmCamps=out;
      store.set('cc.osm',{key:key,at:Date.now(),list:out});
    }catch(e){ui.osmErr=true}
    finally{ui.osmBusy=false;if(ui.wxOpen)updateSuggest()}
  }

  /* ---------- 지역·장소 검색(지오코딩) ---------- */
  var placeCache={},placeTimer=null;
  async function loadPlaces(q){
    var key=str(q);
    if(key.length<2)return;
    if(placeCache[key]){
      if(str(ui.wxQ)===key){ui.places=placeCache[key];updateSuggest()}

      var d=await res.json();
      var out=((d&&d.results)||[]).map(function(r){
        return {name:str(r.name),sido:'',sg:'',region:[r.admin1,r.country].filter(Boolean).join(' · '),lat:r.latitude,lon:r.longitude,kind:0,kindText:'지역',src:'geo'};
      });
      placeCache[key]=out;
      if(str(ui.wxQ)===key){ui.places=out;updateSuggest()}

  /* ---------- 자동완성 목록 만들기 ---------- */
  function suggestGroups(){
    var q=str(ui.wxQ),my=ui.myLoc,groups=[];
    if(!q){
      if(profile.camp){
        groups.push({title:'선택한 캠핑지',items:[{name:profile.camp.name,region:profile.camp.region||'',lat:profile.camp.lat,lon:profile.camp.lon,kindText:'저장됨',src:'picked'}]});
      }
      var recents=(store.get('cc.camps',[])||[]).filter(function(c){return !(profile.camp&&c.name===profile.camp.name)});
      if(recents.length)groups.push({title:'최근 찾은 캠핑지',items:recents.slice(0,4).map(function(c){return {name:c.name,region:c.region||'',lat:c.lat,lon:c.lon,kindText:'최근',src:'recent'}})});
      if(my){
        var near=nearbyCamps(my,8,80);
        if(near.length)groups.push({title:'📍 내 주변 캠핑장 (가까운 순)',items:near});
        var osm=(ui.osmCamps||[]).slice().map(function(c){c.d=distKm(my,c);return c}).sort(function(a,b){return a.d-b.d}).slice(0,5);
        if(osm.length)groups.push({title:'📡 실시간 지도에서 찾은 주변 야영지',items:osm});
      }
      return groups;
    }
    var matches=campPool().map(function(c){return {c:c,s:campMatch(c,q)}}).filter(function(x){return x.s>0});
    matches.sort(function(a,b){
      if(b.s!==a.s)return b.s-a.s;
      if(my)return distKm(my,a.c)-distKm(my,b.c);
      return String(a.c.name).localeCompare(String(b.c.name));
    });
    if(matches.length)groups.push({title:'⛺ 캠핑장 이름·지역',items:matches.slice(0,7).map(function(x){return x.c})});
    if(ui.places&&ui.places.length)groups.push({title:'🗺️ 지역·장소로 찾기 (그 지역 날씨)',items:ui.places.slice(0,4)});
    return groups;
  }
  function suggestRows(){

        rows.push({name:c.name,region:c.region||'',kindText:c.kindText||'',src:c.src||'data',lat:c.lat,lon:c.lon,dist:my?distKm(my,c):null});

      else if(!my)rows.push({hint:'현재 위치를 허용하면 가까운 캠핑장부터 찾아 드려요.',action:'loc-use',btn:'📍 내 위치로 찾기'});
      else rows.push({hint:'주변 80km 안에서 캠핑장을 찾지 못했어요. 이름이나 지역 이름으로 검색해 보세요.'});

  /* ---------- 날씨 ---------- */
  function wxKey(loc){return Number(loc.lat).toFixed(2)+','+Number(loc.lon).toFixed(2)}
  function wxUrl(lat,lon){
    return 'https://api.open-meteo.com/v1/forecast?latitude='+Number(lat).toFixed(4)+'&longitude='+Number(lon).toFixed(4)+
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m'+
      '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset'+
      '&timezone=Asia%2FSeoul&forecast_days=4';
  }
  function parseWx(d){
    var c=d.current||{},h=d.hourly||{},dy=d.daily||{};
    var hours=[];
    if(Array.isArray(h.time)&&h.time.length){
      var nowIso=String(c.time||'').slice(0,13)||String(h.time[0]).slice(0,13);
      var start=0;
      for(var i=0;i<h.time.length;i++){if(String(h.time[i]).slice(0,13)>=nowIso){start=i;break}}
      for(var j=start;j<h.time.length&&j<start+12;j++){
        hours.push({
          t:String(h.time[j]).slice(11,16),
          temp:pick(h.temperature_2m,j),pop:pick(h.precipitation_probability,j),
          prec:pick(h.precipitation,j),code:pick(h.weather_code,j),wind:pick(h.wind_speed_10m,j)
        });
      }
    }
    var days=[];
    if(Array.isArray(dy.time)){
      for(var k=0;k<dy.time.length&&k<4;k++){
        days.push({
          d:dy.time[k],code:pick(dy.weather_code,k),tmin:pick(dy.temperature_2m_min,k),tmax:pick(dy.temperature_2m_max,k),
          pop:pick(dy.precipitation_probability_max,k),prec:pick(dy.precipitation_sum,k),wind:pick(dy.wind_speed_10m_max,k)
        });
      }
    }
    return {
      at:Date.now(),t:c.time||'',temp:(c.temperature_2m==null?null:c.temperature_2m),feels:(c.apparent_temperature==null?null:c.apparent_temperature),
      hum:c.relative_humidity_2m,prec:c.precipitation,code:c.weather_code,wind:c.wind_speed_10m,gust:c.wind_gusts_10m,
      sunrise:Array.isArray(dy.sunrise)?dy.sunrise[0]:null,sunset:Array.isArray(dy.sunset)?dy.sunset[0]:null,
      hours:hours,days:days
    };
  }
  function pick(arr,i){return (arr&&arr[i]!=null)?arr[i]:null}
  function wxInfo(w){
    if(!w)return null;
    var code=w.code,feels=(w.feels==null)?(w.temp==null?15:w.temp):w.feels;
    var pop=0;
    (w.hours||[]).slice(0,6).forEach(function(h){if(h.pop!=null&&h.pop>pop)pop=h.pop});
    if(!pop&&w.days&&w.days[0]&&w.days[0].pop!=null)pop=w.days[0].pop;
    var snowNow=(SNOW_CODES.indexOf(code)>=0)||(w.prec>0.3&&(w.temp!=null&&w.temp<1.5));
    var rainNow=!snowNow&&((RAIN_CODES.indexOf(code)>=0)||w.prec>0.3||pop>=60);
    var tags=[];
    if(snowNow)tags.push('snow');else if(rainNow)tags.push('rain');
    if(w.wind>=8||w.gust>=14)tags.push('wind');
    if(feels<=5)tags.push('cold');else if(feels<=12)tags.push('chilly');
    if(feels>=29)tags.push('hot');else if(feels>=24)tags.push('warm');
    if(!tags.length)tags.push('mild');
    return {tags:tags,primary:tags[0],label:(w.manual?w.label:wmo(code)[0]),icon:wmo(code)[1],pop:pop,feels:feels,rain:rainNow,snow:snowNow,manual:!!w.manual};
  }
  function wxMenus(info){
    var out=[],seen={};
    info.tags.slice(0,2).forEach(function(t){
      (WX_RULES[t]&&WX_RULES[t].menus||[]).forEach(function(m){
        if(seen[m.n])return;
        seen[m.n]=1;
        out.push({n:m.n,w:m.w,min:m.min,label:WX_RULES[t].label});
      });
    });
    return out.slice(0,4);
  }
  function wxGear(info){
    var out=[],seen={};
    info.tags.forEach(function(t){
      (WX_RULES[t]&&WX_RULES[t].gear||[]).forEach(function(g){
        if(seen[g[0]])return;
        seen[g[0]]=1;
        out.push({n:g[0],g:g[1]||'소모품'});
      });
    });
    return out.slice(0,6);
  }
  async function loadWeather(){
    var loc=ui.wxLoc;
    if(!loc){render();return}
    ui.wxBusy=true;ui.wxErr='';render();
    var key=wxKey(loc);
    try{
      var res=await fetchTimeout(wxUrl(loc.lat,loc.lon),12000);
      if(!res.ok)throw new Error('http '+res.status);
      var data=parseWx(await res.json());
      ui.wx=data;ui.wxKey=key;ui.wxErr='';ui.wxStale=false;
      store.set('cc.wx',{key:key,at:Date.now(),data:data,loc:loc});
    }catch(e){
      var cached=store.get('cc.wx',null);
      if(cached&&cached.key===key&&cached.data){
        ui.wx=cached.data;ui.wxKey=key;ui.wxStale=true;
        showNotice('신호가 약해 저장해 둔 예보를 보여드려요.');
      }else{
        ui.wxErr='날씨를 못 불러왔어요. 신호가 약하거나 날씨 서비스가 잠시 막힌 상태예요. 아래에서 지금 날씨를 직접 골라도 맞춤 메뉴는 그대로 나와요.';
      }
    }finally{ui.wxBusy=false;render()}
  }
  function setManualWx(k){
    var p=null;
    MANUAL_WX.forEach(function(x){if(x.k===k)p=x});
    if(!p)return;
    ui.wx={manual:true,label:p.label,at:Date.now(),temp:p.temp,feels:p.feels,code:p.code,prec:p.prec,wind:p.wind,gust:p.wind,hours:[],days:[],sunrise:null,sunset:null};
    ui.wxKey='manual:'+p.k;ui.wxErr='';ui.wxStale=false;
    showNotice('「'+p.label+'」 기준으로 날씨 맞춤 메뉴를 골랐어요.');
    render();
  }

  /* ---------- 날씨가 준비물·추천에 반영되는 부분 ---------- */
  function wxContext(){
    var w=ui.wx;

    var info=wxInfo(w);
    var loc=ui.wxLoc||profile.camp||null;
    return {
      info:info,
      tag:info.primary,
      icon:WX_RULES[info.primary].icon,
      label:info.label,
      summary:(w.manual?'':wmo(w.code)[0]+' ')+deg(info.feels)+' · 강수확률 '+info.pop+'%',
      where:loc?(loc.name+(loc.region?' ('+loc.region+')':'')):'캠핑지',
      name:loc?loc.name:'캠핑지',
      line:WX_RULES[info.primary].line,
      prescribe:WX_RULES[info.primary].prescribe
    };
  }

    if(wxMenuNameCache[tag])return wxMenuNameCache[tag];
    var arr=(WX_RULES[tag]&&WX_RULES[tag].menus||[]).map(function(m){return m.n});

  /* ---------- 날씨 대비 준비물 ---------- */
  function addWeatherGear(){
    var wx=wxContext();
    if(!wx){showNotice('먼저 캠핑지를 고르거나 날씨를 선택해 주세요.');return}
    var gear=wxGear(wx.info);
    if(!gear.length)return;
    var stamp=Date.now();
    var items=gear.map(function(g,i){
      return {id:'w'+(stamp+i),group:g.g,text:g.n,amount:'',alt:'',tag:'',checked:false,note:'날씨 대비'};
    });
    if(!list){
      list={
        dish:wx.name+' 날씨 대비 준비물',
        dishes:[wx.name+' 날씨 대비 준비물'],
        reason:wx.icon+' '+wx.label+' 예보에 맞춘 준비물이에요.',
        people:ui.people,
        summary:wx.icon+' '+wx.label+' 날씨 기준 · '+wx.where,
        pairing:'',
        items:items,
        prepTips:[WX_RULES[wx.tag].tip],
        steps:[],
        tips:[WX_RULES[wx.tag].tip]
      };
    }else{
      var added=0;
      gear.forEach(function(g,i){
        var exists=list.items.some(function(x){return x.group===g.g&&x.text===g.n});
        if(!exists){
          list.items.push({id:'w'+(stamp+i),group:g.g,text:g.n,amount:'',alt:'',tag:'',checked:false});
          added++;
        }
      });
      list.prepTips=(list.prepTips||[]);
      if(list.prepTips.indexOf(WX_RULES[wx.tag].tip)<0)list.prepTips.push(WX_RULES[wx.tag].tip);
      if(!added){showNotice('날씨 대비 준비물이 이미 목록에 있어요.');return}
    }
    store.set('cc.list',list);
    ui.tab='list';window.scrollTo(0,0);
    showNotice(wx.icon+' '+wx.label+' 날씨 대비 준비물 '+gear.length+'개를 준비물 목록에 넣었어요!');
  }

  function formatChecklistText(onlyUnchecked){
    if(!list)return '';
    var lines=[];
    lines.push('⛺ [캠핑음식 도우미] '+list.dish+' ('+list.people+'명 기준)');
    if(list.summary||list.reason)lines.push(list.summary||list.reason);
    lines.push('');
    ['재료','장비','소모품'].forEach(function(g){
      var its=list.items.filter(function(x){return x.group===g&&(!onlyUnchecked||!x.checked)});
      if(!its.length)return;
      lines.push('■ '+g);
      its.forEach(function(x){
        var mark=x.checked?'[✓] ':'[ ] ';
        var amt=x.amount?' ('+x.amount+')':'';
        var tag=x.tag&&TAGS[x.tag]?' · '+TAGS[x.tag]:'';
        var alt=x.alt?' (대체: '+x.alt+')':'';
        lines.push(mark+x.text+amt+tag+alt);
      });
      lines.push('');
    });
    if(!onlyUnchecked&&list.prepTips&&list.prepTips.length){
      lines.push('■ 집에서 미리');
      list.prepTips.forEach(function(t){lines.push('- '+t)});
      lines.push('');
    }
    if(!onlyUnchecked&&list.steps&&list.steps.length){
      lines.push('■ 조리 순서');
      list.steps.forEach(function(t,idx){lines.push((idx+1)+'. '+t)});
    }
    return lines.join('\n').trim();
  }

  function showNotice(msg){
    ui.notice=msg;
    render();
    setTimeout(function(){if(ui.notice===msg){ui.notice='';render()}},2800);
  }

  async function copyChecklist(onlyUnchecked){
    var txt=formatChecklistText(onlyUnchecked);
    if(!txt)return;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(txt);
      }else{
        var ta=document.createElement('textarea');
        ta.value=txt;
        ta.style.position='fixed';
        ta.style.opacity='0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showNotice(onlyUnchecked?'남은 준비물만 클립보드에 복사했어요!':'전체 준비물 목록을 클립보드에 복사했어요!');
    }catch(e){
      showNotice('복사하지 못했어요. 다시 시도해 주세요.');
    }
  }

  async function shareChecklist(){
    var txt=formatChecklistText(false);
    if(!txt)return;
    if(navigator.share){
      try{
        await navigator.share({
          title:'[캠핑 준비물] '+list.dish,
          text:txt
        });
        return;
      }catch(e){
        if(e&&e.name==='AbortError')return;
      }
    }
    await copyChecklist(false);
  }

  function filterMatchesItem(x){
    if(ui.filter==='all')return true;
    if(ui.filter==='unchecked')return !x.checked;
    if(ui.filter==='prep')return x.tag==='prep';
    if(ui.filter==='pack')return x.tag==='pack'||(!x.tag&&x.group!=='재료');
    if(ui.filter==='buy')return x.tag==='buy';
    return true;
  }

  function clampPeople(n){return Math.max(1,Math.min(20,n))}

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');
    if(!b)return;
    var a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
    if(a==='tab'){ui.tab=v;ui.confirmClear=false;window.scrollTo(0,0);render();return}
    if(a==='style'||a==='meal'||a==='time'||a==='mood'){ui[a]=v;render();return}
    if(a==='filter'){ui.filter=v;render();return}
    if(a==='dec'){ui.people=clampPeople(ui.people-1);ui.recs=[];render();return}
    if(a==='inc'){ui.people=clampPeople(ui.people+1);ui.recs=[];render();return}
    if(a==='setpeople'){ui.people=clampPeople(Number(v)||2);ui.recs=[];render();return}
    if(a==='pset'){profile.people=clampPeople(Number(v)||2);ui.people=profile.people;ui.recs=[];saveProfile();render();return}
    if(a==='addgear'){
      var gIn=document.getElementById('gear-inline-add');
      var gVal=str(gIn&&gIn.value);
      if(gVal){
        if(profile.gear.indexOf(gVal)<0)profile.gear.push(gVal);
        ui.recs=[];
        saveProfile();render();
      }
      return;
    }
    if(a==='recs'){getRecs(false);return}
    if(a==='more'){getRecs(true);return}
    if(a==='pick'||a==='merge'){
      var pool=(ui.CurrentRenderedRecs&&ui.CurrentRenderedRecs.length)?ui.CurrentRenderedRecs:ui.recs;
      pickDish(pool[Number(b.getAttribute('data-i'))],a==='merge');
      return;
    }
    if(a==='mergedish'){
      var dIn=document.getElementById('dish-add');
      var dVal=str(dIn&&dIn.value);
      if(dVal){
        ui.dishText=dVal;
        pickDish({name:dVal,minutes:0,level:'',equipment:[],reason:'직접 추가한 요리'},true);
      }
      return;
    }
    if(a==='cookmode'){
      ui.cookMode=!ui.cookMode;
      if(ui.cookMode){
        ui.cookStep=0;
        var firstStep=(list&&list.steps&&list.steps[0])||'';
        ui.timerSec=detectStepSeconds(firstStep);
        toggleWakeLock(true);
        if(ui.ttsAuto)speakStep(firstStep);
      }else{
        if(ui.timerRunning)toggleTimer();
        stopTTS();
        toggleWakeLock(false);
      }
      render();
      return;
    }
    if(a==='cook-tts'){
      if(ui.ttsSpeaking){
        stopTTS();
        render();
      }else{
        var steps=(list&&list.steps&&list.steps.length)?list.steps:[];
        speakStep(steps[ui.cookStep]||'');
      }
      return;
    }
    if(a==='cook-tts-auto'){
      ui.ttsAuto=!ui.ttsAuto;
      store.set('cc.ttsAuto',ui.ttsAuto);
      showNotice(ui.ttsAuto?'단계 변경 시 음성으로 자동 안내해요!':'음성 자동 안내를 껐어요.');
      render();
      return;
    }
    if(a==='cook-prev'){
      if(ui.cookStep>0){
        ui.cookStep--;
        ui.timerSec=detectStepSeconds(list&&list.steps&&list.steps[ui.cookStep]);
        if(ui.ttsAuto)speakStep(list&&list.steps&&list.steps[ui.cookStep]);
      }
      render();
      return;
    }
    if(a==='cook-next'){
      var maxS=(list&&list.steps)?list.steps.length-1:0;
      if(ui.cookStep<maxS){
        ui.cookStep++;
        ui.timerSec=detectStepSeconds(list&&list.steps&&list.steps[ui.cookStep]);
        if(ui.ttsAuto)speakStep(list&&list.steps&&list.steps[ui.cookStep]);
      }else{
        ui.cookMode=false;
        stopTTS();
        toggleWakeLock(false);
        showNotice('맛있는 캠핑 요리가 완성되었어요! 아래에서 별점 일지를 남겨보세요.');
      }
      render();
      return;
    }
    if(a==='timer-toggle'){toggleTimer();return}
    if(a==='timer-set'){
      if(ui.timerRunning)toggleTimer();
      ui.timerSec=Number(v)||180;
      render();
      return;
    }
    if(a==='quickmod'){
      modifyChecklist(v);
      return;
    }
    if(a==='star'){
      ui.logStars=Number(v)||5;
      var noteEl=document.getElementById('log-note');
      if(noteEl)ui.logNote=noteEl.value;
      render();
      return;
    }
    if(a==='replaylog'){
      var logEntry=logs[Number(b.getAttribute('data-i'))];
      if(logEntry){
        ui.people=logEntry.people||ui.people;
        pickDish({name:logEntry.dish,minutes:0,level:'',equipment:[],reason:'일지에서 다시 불러온 요리'},false);
      }
      return;
    }
    if(a==='exportdata'){
      var payload=JSON.stringify({profile:profile,list:list,recent:recent,logs:logs},null,2);
      var blob=new Blob([payload],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var link=document.createElement('a');
      link.href=url;
      link.download='camping-food-backup.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showNotice('백업 파일(camping-food-backup.json)을 저장했어요!');
      return;
    }
    if(a==='stop'){if(ctl)ctl.abort();return}
    if(a==='loc-use'){useMyLocation();return}
    if(a==='osm-load'){loadOsmNearby(true);return}
    if(a==='ac-pick'){selectSuggest(b.getAttribute('data-i'));return}
    if(a==='wx-clear'){clearCamp();return}
    if(a==='wx-refresh'){if(ui.wxLoc)loadWeather();else if(profile.camp){ui.wxLoc=profile.camp;loadWeather();}else showNotice('먼저 캠핑지를 골라 주세요.');return}
    if(a==='wx-manual'){setManualWx(v);return}
    if(a==='wx-menu'){pickWeatherMenu(v);return}
    if(a==='wx-gear'){addWeatherGear();return}
    if(a==='wx-ai'){wxAiRecs();return}
    if(a==='wxaware'){profile.wxAware=!profile.wxAware;saveProfile();showNotice('날씨 맞춤 추천을 '+(profile.wxAware?'켰어요.':'껐어요.'));return}
    if(a==='toggle'){
      var id=b.getAttribute('data-id');
      list.items.forEach(function(x){if(x.id===id)x.checked=!x.checked});
      store.set('cc.list',list);render();return;
    }
    if(a==='clear'){ui.confirmClear=true;render();return}
    if(a==='clear2'){list=null;store.set('cc.list',null);ui.confirmClear=false;ui.cookMode=false;render();return}
    if(a==='copylist'){copyChecklist(false);return}
    if(a==='copyunchecked'){copyChecklist(true);return}
    if(a==='sharelist'){shareChecklist();return}
    if(a==='pdec'){profile.people=clampPeople(profile.people-1);ui.people=profile.people;saveProfile();render();return}
    if(a==='pinc'){profile.people=clampPeople(profile.people+1);ui.people=profile.people;saveProfile();render();return}
    if(a==='gear'){
      var i=profile.gear.indexOf(v);
      if(i>=0)profile.gear.splice(i,1);else profile.gear.push(v);
      saveProfile();render();return;
    }
    if(a==='rmavoid'){profile.avoid=profile.avoid.filter(function(x){return x!==v});saveProfile();render();return}
    if(a==='clearrecent'){recent=[];store.set('cc.recent',recent);render();return}
  });

    if(!e.target||e.target.id!=='camp-search')return;

  document.addEventListener('change',function(e){
    if(e.target&&e.target.id==='import-file'){
      var file=e.target.files&&e.target.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        try{
          var parsed=JSON.parse(String(ev.target.result||''));
          if(parsed.profile){profile=parsed.profile;store.set('cc.profile',profile);ui.people=profile.people||2}
          if(parsed.list!==undefined){list=parsed.list;store.set('cc.list',list)}
          if(Array.isArray(parsed.recent)){recent=parsed.recent;store.set('cc.recent',recent)}
          if(Array.isArray(parsed.logs)){logs=parsed.logs;store.set('cc.logs',logs)}
          showNotice('백업 데이터를 성공적으로 복원했어요!');
        }catch(err){
          showNotice('올바른 백업 파일이 아니에요.');
        }
      };
      reader.readAsText(file);
    }
  });

  document.addEventListener('submit',function(e){
    var f=e.target.closest('[data-form]');
    if(!f)return;
    e.preventDefault();
    var kind=f.getAttribute('data-form');
    var input=f.querySelector('input');
    var val=str(input&&input.value);
    if(kind==='log'){
      if(!list)return;
      var today=new Date().toISOString().slice(0,10);
      logs.unshift({
        dish:list.dish,
        people:list.people,
        stars:ui.logStars||5,
        note:val,
        date:today
      });
      logs=logs.slice(0,30);
      store.set('cc.logs',logs);
      ui.logNote='';
      showNotice('캠핑 요리 일지에 저장했어요! (내 정보 탭에서 확인 가능)');
      return;
    }
    if(!val)return;
    if(kind==='modify'){ui.modText=val;modifyChecklist(val);return}
    if(kind==='dish'){ui.dishText=val;pickDish({name:val,minutes:0,level:'',equipment:[],reason:'직접 고른 요리'},false);return}
    if(kind==='gear'){if(profile.gear.indexOf(val)<0)profile.gear.push(val)}
    if(kind==='avoid'){if(profile.avoid.indexOf(val)<0)profile.avoid.push(val)}
    saveProfile();render();
  });

  render();
  (async function(){
    try{sampleFn=(window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){sampleFn=null}
    if(!sampleFn){
      sampleFn={
        json:async function(prompt,opts){
          try{
            var res=await fetch('/api/sample',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({prompt:prompt}),
              signal:opts&&opts.signal
            });
            var data=await res.json();
            if(!res.ok)throw {code:(data&&data.code)||'upstream_error'};
            return data;
          }catch(err){
            if(err&&err.name==='AbortError')throw {code:'cancelled'};
            if(err&&err.code)throw err;
            throw {code:'upstream_error'};
          }
        }
      };
    }
    ui.aiOk=!!sampleFn;

    var savedLoc=store.get('cc.loc',null);
    if(savedLoc&&savedLoc.lat&&savedLoc.lon)ui.myLoc=savedLoc;
    if(profile.camp&&profile.camp.lat!=null){
      ui.wxLoc={name:profile.camp.name,region:profile.camp.region||'',lat:profile.camp.lat,lon:profile.camp.lon,src:profile.camp.src||'data'};
      var cachedWx=store.get('cc.wx',null);
      if(cachedWx&&cachedWx.key===wxKey(ui.wxLoc)&&cachedWx.data){
        ui.wx=cachedWx.data;
        ui.wxKey=cachedWx.key;
        ui.wxStale=(Date.now()-(cachedWx.at||0))>3*3600*1000;
      }
      render();
      if(ui.myLoc)loadOsmNearby();
      if(!ui.wx||ui.wxStale)loadWeather();
      else updateSuggest();
    }else{
      render();
      if(ui.myLoc)loadOsmNearby();
    }
  })();
})();
</script>

</html>
