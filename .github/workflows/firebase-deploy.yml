# main 브랜치 푸시 시 코드 품질 검증 후 Firebase Hosting에 자동 배포하는 CI/CD 파이프라인.
# PR 생성/업데이트 시에는 프리뷰 채널 URL을 생성할 수 있도록 구성되어 있다.
name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: 품질 검증 및 Firebase Hosting 자동 배포
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 백엔드 및 스크립트 문법 검사
        run: |
          set -e
          node --check server.js
          for f in api/*.js lib/*.js scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: 클라이언트 정적 보안 스캔 (process.env 등 서버 전용 참조 검출)
        run: npm run check:client

      - name: 자동 테스트 (UI 및 Firebase 배포 설정)
        run: npm test

      - name: HTML 유효성 검사
        run: npx --yes html-validate@8.29.0 index.html camp-kitchen.html

      - name: Firebase Hosting 배포용 번들(dist/) 빌드
        run: npm run build

      - name: Firebase 배포 설정 검증
        id: firebase_config
        # fork·Dependabot PR에는 배포 자격 증명을 사용하지 않는다.
        # 수동 실행도 main에서만 live 배포를 허용한다.
        if: >-
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_ALLOW_MISSING: ${{ github.event_name == 'pull_request' }}
        run: npm run check:firebase

      - name: Firebase 배포 생략 안내
        if: steps.firebase_config.outcome == 'skipped'
        run: |
          echo '### Firebase 배포 생략' >> "$GITHUB_STEP_SUMMARY"
          echo 'fork·Dependabot PR 또는 main 이외 브랜치의 수동 실행은 품질 검사와 빌드만 수행합니다. Firebase 배포 성공을 의미하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"

      - name: Firebase Hosting 프로덕션 배포 (main 전용)
        id: deploy_live
        if: steps.firebase_config.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.firebase_config.outputs.project_id }}
          channelId: live

      - name: Firebase Hosting PR 프리뷰 배포 (Pull Request 시)
        id: deploy_preview
        if: steps.firebase_config.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.firebase_config.outputs.project_id }}
          expires: 7d

      - name: Firebase 배포 실패 확인 사항
        if: failure() && (steps.deploy_live.outcome == 'failure' || steps.deploy_preview.outcome == 'failure')
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Firebase Hosting 배포 실패

          설정 형식 검사·빌드 통과는 실제 배포 성공을 의미하지 않습니다. 실패한 배포 단계의 첫 Firebase 오류를 확인하세요.

          - 프로젝트 없음/접근 거부: `FIREBASE_PROJECT_ID`(미설정 시 서비스 계정의 `project_id`)와 대상 프로젝트의 서비스 계정 Hosting 권한을 확인합니다.
          - 인증 오류: `FIREBASE_SERVICE_ACCOUNT` 키가 삭제·만료·비활성화되지 않았는지 확인합니다.
          - Hosting 사이트 없음: 대상 프로젝트에 Firebase와 Hosting 사이트가 준비되어 있는지 확인합니다.
          - 자세한 점검·재실행 절차는 README의 Firebase 배포 문제 해결 절을 참고하세요. 키 JSON이나 원본 디버그 로그를 공개 이슈에 첨부하지 마세요.
          EOF
